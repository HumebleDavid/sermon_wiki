<!DOCTYPE html>
<html lang="ko" data-theme="light" data-font="serif" data-size="18">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍동우 목사의 설교 저장소</title>
  <meta name="description" content="홍동우 목사의 지난 10년(2016-2026)간의 설교문, 강의안, 외부 기고문 및 신학 위키 아카이브">
  
  <!-- 웹폰트: 본문 명조체 (Noto Serif KR) 및 고딕체 (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- 마크다운 파서 CDN (오프라인 시 자체 파서 폴백 내장) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 모바일 백드롭 오버레이 -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <!-- 메인 앱 컨테이너 -->
  <div id="app" class="app-layout">
    
    <!-- ================= 좌측 사이드바 (2단 분할) ================= -->
    <aside id="sidebar" class="sidebar">
      <!-- 1. 사이드바 헤더 및 브랜드 타이틀 -->
      <header class="sidebar-header">
        <div class="brand">
          <a href="#home" class="brand-link">
            <span class="brand-icon">🏛️</span>
            <div class="brand-text">
              <h1 class="brand-title">홍동우 목사의 설교 저장소</h1>
              <p class="brand-subtitle">신학 및 설교 아카이브 (2016–2026)</p>
            </div>
          </a>
          <button id="close-drawer-btn" class="icon-btn mobile-only" title="메뉴 닫기" aria-label="메뉴 닫기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- 실시간 통합 검색창 -->
        <div class="search-box">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="제목, 성경본문, 신학자, 개념 검색..." autocomplete="off">
          <button id="search-clear-btn" class="search-clear-btn hidden" title="검색어 지우기">&times;</button>
        </div>
      </header>

      <!-- 2. 검색 결과 패널 (검색 시 활성화) -->
      <div id="search-results-panel" class="search-results-panel hidden">
        <div class="search-results-header">
          <span id="search-results-count">검색 결과 0건</span>
          <button id="search-back-btn" class="text-btn">목록으로</button>
        </div>
        <ul id="search-results-list" class="search-results-list"></ul>
      </div>

      <!-- 3. 좌측 2단 분할 메뉴 (RAW 상단 50% / WIKI 하단 50%) -->
      <div id="sidebar-split-container" class="sidebar-split-container">
        
        <!-- [상단 50% 섹션: 📖 RAW 원본 아카이브] -->
        <section class="split-section raw-section" aria-label="RAW 원본 설교 및 기고문">
          <div class="split-section-header">
            <div class="section-title-wrap">
              <span class="section-icon">📖</span>
              <h2 class="section-title">RAW 원본 아카이브</h2>
            </div>
            <span id="raw-total-badge" class="badge">138편</span>
          </div>
          <div class="split-section-scroll" id="raw-tree-container">
            <!-- 자바스크립트로 4대 시기 및 기고문 아코디언 트리 렌더링 -->
          </div>
        </section>

        <!-- 섹션 구분선 / 리사이저 바 -->
        <div class="split-divider">
          <span class="divider-line"></span>
          <span class="divider-label">KNOWLEDGE BASE</span>
          <span class="divider-line"></span>
        </div>

        <!-- [하단 50% 섹션: 🧠 WIKI 신학 지식베이스] -->
        <section class="split-section wiki-section" aria-label="WIKI 신학 지식베이스">
          <div class="split-section-header">
            <div class="section-title-wrap">
              <span class="section-icon">🧠</span>
              <h2 class="section-title">WIKI 신학 지식베이스</h2>
            </div>
            <span id="wiki-total-badge" class="badge">269편</span>
          </div>
          <div class="split-section-scroll" id="wiki-tree-container">
            <!-- 자바스크립트로 위키 카테고리 트리 렌더링 -->
          </div>
        </section>

      </div>
      
      <!-- 사이드바 푸터 (볼트 기본 정보) -->
      <footer class="sidebar-footer">
        <div class="footer-links">
          <a href="#doc/02_Wiki/index.md" class="footer-link">📋 마스터 인덱스</a>
          <span class="sep">·</span>
          <a href="#doc/02_Wiki/log.md" class="footer-link">📜 아카이브 로그</a>
        </div>
        <div class="footer-copy">© 2016–2026 Pastor Dong-woo Hong</div>
      </footer>
    </aside>

    <!-- ================= 우측 본문 열람 영역 ================= -->
    <main class="main-content">
      
      <!-- 상단 글로벌 툴바 (스티키 헤더) -->
      <header class="top-toolbar">
        <div class="toolbar-left">
          <!-- 모바일 햄버거 메뉴 버튼 -->
          <button id="open-drawer-btn" class="icon-btn mobile-only" title="메뉴 열기" aria-label="메뉴 열기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <!-- 브레드크럼 위치 표시 -->
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb">
            <a href="#home" class="crumb-home">홈</a>
            <span class="crumb-sep">/</span>
            <span id="crumb-category" class="crumb-item">아카이브</span>
            <span class="crumb-sep">/</span>
            <span id="crumb-title" class="crumb-item active">문서 열람</span>
          </nav>
        </div>

        <div class="toolbar-right">
          <!-- 원본(RAW) <-> 위키(WIKI) 상호 교차 이동 버튼 (스마트 토글) -->
          <div id="cross-nav-container" class="cross-nav-wrap hidden">
            <button id="cross-nav-btn" class="cross-nav-btn" title="교차 분석 문서로 이동">
              <span id="cross-nav-icon">🧠</span>
              <span id="cross-nav-label">WIKI 분석 노트 보기</span>
            </button>
          </div>

          <!-- 서체 토글 (명조 / 고딕) -->
          <div class="font-family-controls">
            <button id="font-serif-btn" class="chip-btn active" title="명조체 (품격 있는 신학 서체)">명조</button>
            <button id="font-sans-btn" class="chip-btn" title="고딕체 (깔끔하고 선명한 서체)">고딕</button>
          </div>

          <!-- 글자 크기 조절 스테퍼 (A- / 18px / A+) -->
          <div class="font-size-controls" aria-label="글자 크기 조절">
            <button id="font-decrease-btn" class="icon-btn size-btn" title="글자 축소">A-</button>
            <span id="font-size-indicator" class="font-size-indicator">18px</span>
            <button id="font-increase-btn" class="icon-btn size-btn" title="글자 확대">A+</button>
          </div>

          <!-- 테마 토글 (라이트 / 다크) -->
          <button id="theme-toggle-btn" class="icon-btn theme-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
            <span id="theme-icon">🌙</span>
          </button>
        </div>
      </header>

      <!-- 독서 및 문서 뷰어 컨테이너 -->
      <div id="content-scroll" class="content-scroll">
        <article id="content-area" class="article-container">
          <!-- 홈 화면 대시보드 또는 개별 문서가 렌더링되는 영역 -->
          <div id="loading-spinner" class="loading-state">
            <div class="spinner"></div>
            <p>아카이브 데이터를 불러오는 중입니다...</p>
          </div>
        </article>
      </div>

      <!-- 플로팅 탑 버튼 -->
      <button id="scroll-to-top-btn" class="scroll-top-btn hidden" title="맨 위로 스크롤" aria-label="맨 위로">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
    </main>

  </div>

  <!-- 데이터 번들 로드 -->
  <script src="data.js"></script>
  <!-- 클라이언트 웹 앱 로직 -->
  <script src="app.js"></script>
</body>
</html>
