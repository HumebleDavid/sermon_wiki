          body: `# 홍동우 목사의 설교 저장소 (2016–2026)\n\n> [!tip] 🌐 아카이브 탐색 안내\n> 본 웹페이지는 **홍동우 목사의 10년 설교 및 신학 아카이브(2016~2026)**를 집대성한 디지털 위키입니다.\n> - **좌측 상단 (01_RAW):** 시대별·교회별 원본 설교문(126편) 및 외부 매체 기고문(12편)을 열람할 수 있습니다.\n> - **좌측 하단 (02_WIKI):** 10년 신학 사상을 분석한 종합 보고서, 시리즈 노트, 핵심 신학 개념, 신학자 노트, 개별 설교 정밀 분석 노트를 탐색할 수 있습니다.\n> - **스마트 교차 전환:** 원본 설교(RAW)를 읽다가 상단의 **[🧠 WIKI 분석 노트 보기]** 버튼을 누르면 대응하는 신학 분석 문서로 즉시 이동합니다.\n\n---\n\n## 1. 시대별 종합 및 사상 궤적 보고서 (\`02_Wiki/synthesis/\`)\n1. [[00_2016-2026_10년_사역계승_및_신학궤적_마스터보고서]] — 10년간의 4대 사역 시기(138편)를 관통하는 신학적 본령의 일관성과 목회적 성육신의 진화 마스터 보고서\n2. [[01_핵심_신학적_축_마스터분석]] — 10년 사상을 관통하는 6대 핵심 신학적 축 마스터 분석 (파격적 은혜론, 어린양 기독론, 비극적 신정론, 보혜사 성령론, 실존적 성서론, 공공신학)\n\n---\n\n## 2. 사역 시기별 대표 원본 설교 (\`01_Raw/\`)\n- **Period 1 (2016–2019 Y교회):** [[161030 우리파워교회]] | [[191229 우리다운교회]]\n- **Period 2 (2021–2023 C교회):** [[211017]] (갈라디아서 1강) | [[221106]] (레위기 2강) | [[230903]] (누가복음 2강)\n- **Period 3 (2024–2026 사당역 성경공부방 및 초빙):** [[250214-250215 호원교회 청년부 수련회/1강 비극|1강 비극]] | [[251212 민주주의 시대에 성경 읽기]]\n- **Period 4 (2026 D교회):** [[260104]] (야곱 강해 1강) | [[260222]] (욥기 강해 1강) | [[260911 여호와 이레]]\n- **외부 기고문 (Articles):** [[251101 고통은 낭만적이지 않다]] | [[260415 그건 은혜로 하는 겁니다]]\n\n---\n\n## 3. 핵심 신학 개념 및 신학자 (\`02_Wiki/concepts/\` & \`theologians/\`)\n- **주요 개념:** [[인간다움]] | [[이신칭의와_자격주의_해체]] | [[고통의_비낭만성]] | [[기억의_재채색]] | [[호모_쿵푸스]]\n- **주요 신학자:** [[바울]] | [[누가]] | [[박영선]] | [[톰_라이트]] | [[외르크_프라이]]`

          body: `# 2016–2026 10년 사역 계승 및 신학 궤적 마스터 보고서\n\n> [!abstract] 총괄 테제 (Executive Thesis)\n> **\"내가 성경을 읽는 것이 아니라, 성경이 내 인생을 읽어준다.\"**\n> 지난 10년(2016~2026)간 4개의 사역지(Y교회, C교회, 사당역 연구소, D교회)를 거치며 선포된 138편의 원고는, 세속적 자격주의와 인과응보적 기복신앙을 해체하고 **십자가의 무력함과 보혜사 성령의 기억 재채색을 통해 고통당하는 인간을 구원하시는 하나님의 주권적 은혜**를 일관되게 증언한다.\n\n---\n\n## 1. 4대 사역 시기별 신학적 진화 매트릭스\n\n| 사역 시기 | 중심 사역지 및 역할 | 대표 본문 및 시리즈 | 핵심 신학 키워드 |\n| :--- | :--- | :--- | :--- |\n| **Period 1 (2016–2019)** | Y교회 (고등부·청년부·장년 전임전도사) | [[161030 우리파워교회]], [[191229 우리다운교회]] | [[인간다움]], 말구유의 역설, 성경이 나를 읽음 |\n| **Period 2 (2021–2023)** | C교회 (부목사, 청년부·오후·대예배) | 갈라디아서·계시록·레위기·누가복음·요나서 강해 | [[이신칭의와_자격주의_해체]], 죽임당한 어린양, 희년 |\n| **Period 3 (2024–2026 초)** | 사당역 성경공부방 및 외부 수련회·대학원 강의 | 호원·대덕·산성 수련회, 오이코스 대학원 강의, 기고문 | [[고통의_비낭만성]], [[기억의_재채색]], 성서 탈신화화 |\n| **Period 4 (2026)** | D교회 (부목사, 청년부 및 수요예배 중직자) | 야곱·욥기·요나서·다니엘서·룻기·진로특강 | 하나님의 져주심, 카오스 속의 경외, [[호모_쿵푸스]], 헤세드의 의리 |\n\n---\n\n## 2. 불변하는 신학적 본령과 목회적 조율\n- **은혜의 절대성:** 안디옥 사건([[190427_안디옥_사건과_복음의_본질]], [[211017]])에서 볼 수 있듯, 구원과 공동체의됨에는 예수 그리스도 외에 그 어떤 조건도 필요하지 않다.\n- **고통의 탈낭만화:** [[251101 고통은 낭만적이지 않다]]와 [[260222]]에서 나타나듯, 고통은 하나님의 심판이나 값싼 성장 도구가 아니라 카오스가 잔존하는 세계의 아픔이며, 성도는 그 속에서 여호와를 경외함으로 살아남는다.`

          body: `# 10년 사상을 관통하는 6대 핵심 신학적 축 마스터 분석\n\n> [!quote] 핵심 요약\n> 홍동우 목사의 10년 아카이브는 다음 **6가지 신학적 기둥(The Six Theological Pillars)** 위에 건축되어 있습니다.\n\n## 제1축: 파격적 은혜론 — 이신칭의와 자격주의 해체\n- 관련 개념: [[이신칭의와_자격주의_해체]], [[박영선]], [[바울]]\n- 핵심 테제: \"너 안에 예수 있냐? 그것으로 충분하다.\"\n\n## 제2축: 어린양 기독론 — 말구유와 패배를 자임하시는 하나님\n- 관련 개념: [[인간다움]], [[누가]]\n- 핵심 테제: 가이사 아구스도의 제국 권력이 아닌 구유의 아기와 얍복강에서 져주시는 하나님.\n\n## 제3축: 비극적 신정론 — 고통의 비낭만성과 카오스 속 실존\n- 관련 개념: [[고통의_비낭만성]], [[251101 고통은 낭만적이지 않다]]\n- 핵심 테제: 인과응보의 정죄를 거부하고 카오스 속에서도 생명력(pizzazz)과 연대(헤세드)로 버텨내는 신앙.\n\n## 제4축: 보혜사 성령론 — 기억의 재채색과 상흔의 치유\n- 관련 개념: [[기억의_재채색]], [[외르크_프라이]]\n- 핵심 테제: 과거의 상처와 실패의 기억을 부활과 현재의 사랑 안에서 구속사적 은혜로 다시 쓰시는 성령.\n\n## 제5축: 실존적 성서론 — 성경이 내 인생을 읽는다\n- 관련 개념: [[191229 우리다운교회]], [[호모_쿵푸스]]\n- 핵심 테제: 성경을 교리 자판기로 소비하지 않고, 성경이 내 기구한 삶을 읽어주어 고유한 '나 자신'이 되게 하는 모험.\n\n## 제6축: 대안적 공공신학 — 유다이스모스 타파와 타자 환대\n- 관련 개념: [[251212 민주주의 시대에 성경 읽기]]\n- 핵심 테제: 원자화된 각자도생과 극우 포퓰리즘을 넘어 이방인과 약자를 환대하는 대안 가족 공동체.`

          audience: "고등부",
          series: "우리파워교회",
          tags: ["설교", "고등부설교", "우리파워교회", "삭개오", "누가복음", "미가", "국정농단", "인간다움", "정의와인애", "초기사역"],
          body: `# 우리는 어떻게 살아야 하는가 — 삭개오와 예수, 잃어버린 삶의 방향을 되찾다\n\n> **본문 말씀** : 누가복음 19:1-10, 미가 6:8\n\n### 1. 잊고 살아왔던 삶의 중요한 질문: 수시 합격과 입학 직전의 절박한 불안\n\n때는 바야흐로 2004년 12월 14일이었습니다. 저는 한국해양대학교에 수시원서를 넣었고 후보 1번이라는 통고를 받았습니다. 오전 9시가 되자마자 수험번호를 입력했고 ‘합격’이란 아주 기쁜 소식을 마주하게 되었습니다. 하지만 입학 날짜가 가까워지자 감사함과 안도감은 어느새 불안감으로 변했습니다. **나는 도대체 어떻게 살아야 하냐**는 생각이 문득 들었습니다.\n\n> “나는 무엇을 해야 할까요? 나는 어떻게 살아야 할까요?”\n\n### 2. 삭개오와 예수: 잃어버린 것을 찾아 나선 두 사람의 만남 (눅 19:1-10)\n\n여기 등장하는 두 명의 주연배우는 둘 다 찾는 자입니다. 삭개오는 부를 얻었으나 잃어버린 삶의 방향, 인간다움을 찾아 뽕나무로 올라섰습니다. 반면 예수는 삶의 방향을 잃어버린 채 방황하는 삭개오를 찾아 그의 집에 들어가고자 하십니다.\n\n### 3. 창조주가 인간에게 진정으로 요구하시는 것: 가장 인간다운 삶 (미 6:8)\n\n이 세상의 창조주가 무엇보다도 원하는 것은, 우리가 돈을 많이 버는 것도 아니요, 높은 학벌을 취득하는 것도 아니요, 모든 것을 다스릴 권력을 얻는 것도 아닙니다. **단지 우리가 살아야 할 올바른 방향을 찾아서, 가장 인간다운 삶을 사는 것을 원하고 있다는 것,** 그것이 바로 성경의 메시지이며 기독교의 메시지입니다.\n\n> “이 사람아, 하나님께서 무엇을 좋아하시는지, 무엇을 원하시는지 들어서 알지 않느냐? 정의를 실천하는 일, 기꺼이 은덕에 보답하는 일. 조심스레 하느님과 함께 살아가는 일, 그 일밖에 무엇이 더 있겠느냐?” (미 6:8)`
        },

          body: `# 우리는 어떻게 살아야 하는가 — 삭개오와 예수, 잃어버린 삶의 방향을 되찾다\n\n> **본문 말씀** : 누가복음 19:1-10, 미가 6:8\n\n---\n\n## 1. 핵심 논지 및 해석학적 구조\n본 설교는 2016년 10월 30일, Y교회 고등부(우리파워교회)를 대상으로 선포된 설교입니다. 대입 수능을 앞둔 수험생들의 불안과 2016년 국정농단 시국을 배경으로, 복음을 내세적 도피가 아닌 **잃어버린 참된 [[인간다움]]과 정의의 삶을 회복하는 사건**으로 재구성합니다.\n\n## 2. 원문 무결성 발췌 및 분석\n\n> [!quote] 원문 발췌\n> \"정리하자면 이 세상의 창조주가 무엇보다도 원하는 것은, 우리가 돈을 많이 버는 것도 아니요, 높은 학벌을 취득하는 것도 아니요, 화려한 외모를 꾸미는 것도 아니요, 모든 것을 다스릴 권력을 얻는 것도 아닙니다. **단지 우리가 살아야 할 올바른 방향을 찾아서, 가장 인간다운 삶을 사는 것을 원하고 있다는 것,** 그것이 바로 성경의 메시지이며 기독교의 메시지입니다.\"\n> \n> ---\n> — **신학적 함의:** 세속적 4대 우상(돈, 학벌, 외모, 권력)을 해체하고 [[미가]] 6:8의 정의와 인애를 청소년들의 일상 언어로 번역해 낸 구원론.`
        },
        "01_Raw/Sermons/1. 2016-2019 Y교회/191229 우리다운교회.md": {

          title: "홍도사의 성경론 — 성경이 내 인생을 읽어줄 때 나 자신이 되는 모험을 시작하다",

          subject: "성경이 내 인생을 읽어줄 때 직분을 내려놓고 하나님 앞의 참된 자아로 서는 거룩한 모험",
          audience: "청년부",
          series: "우리다운교회 (고별설교)",
          tags: ["설교", "청년부설교", "고별설교", "성경론", "신정론"],
          body: `# 홍도사의 성경론 — 성경이 내 인생을 읽어줄 때 나 자신이 되는 모험을 시작하다\n\n> **본문 말씀** : 사도행전 2:1-13, 요엘 2:28-32\n\n### 1. 내가 성경을 읽는 것이 아니라 성경이 내 인생을 읽어준다\n\n베드로는 요엘서 성경에서 답을 찾았습니다. 베드로가 성경을 읽은 것이 아니라 사실 성경이 베드로의 인생을 읽어주었습니다. 그리고는 성경이 말해주었습니다. **‘너는 틀린 것이 아니야!’**\n\n성경은 자신의 삶이 결코 해명되지 않았던 사람들이 하나님과 씨름하면서 기록한 역사의 보고입니다. 성경 66권의 중심 주제는 **‘신정론’**입니다.\n\n### 2. 고별의 결단: 여러분 자신이 되십시오\n\n> **“저는 홍동우 전도사이기 이전에, 홍동우이기 때문입니다.”**\n\n성경을 읽으십시오. 성경이 여러분의 인생을 읽어줄 것입니다. 우리의 목적은 돈을 많이 버는 것도, 높은 직위를 갖는 것도 아닙니다. **하나님께서 만드신 우리 자신이 되는 것입니다.**`
        },
        "01_Raw/Sermons/2. 2021-2023 C교회/211017-211114 갈라디아서 강해/211017.md": {

          title: "안디옥 사건과 복음의 본질—예수 하나만으로 충분하기에 특권과 차별을 허무는 교회",

          section: "raw",
          category: "sermons",
          scripture: ["갈라디아서 2:11-21", "갈라디아서 3:28"],
          subject: "안디옥 사건과 복음의 본질—예수 하나만으로 충분하기에 특권과 차별을 허무는 교회",
          series: "2021 갈라디아서 강해 (1강)",
          tags: ["설교", "갈라디아서강해", "안디옥사건", "이신칭의"],
          body: `# 안디옥 사건과 복음의 본질—예수 하나만으로 충분하기에 특권과 차별을 허무는 교회\n\n> **본문 말씀** : 갈라디아서 2:11-21, 갈라디아서 3:28\n\n유대인이라고 한들 이방인보다 한 걸음 앞에 서 있지 않습니다. 모태신앙이라고 한들 이제 막 교회에 나온 사람들보다 한 걸음 앞에 서 있지 않습니다. 누구나 하나님 앞에 서게 될 때 한 가지의 질문을 받습니다.\n\n> **\"너 안에 예수 있냐?\"**\n\n바울이 말하는 바는 거기서 \"예수 있다\"라고 하면 그걸로 더 이상 묻지도 따지지도 않고 끝난다는 겁니다. 유대인의 정체성이 아니라 오직 예수를 가진 그리스도인의 정체성을 갖겠다는 선언이 바로 갈라디아서 2장 16-21절의 핵심입니다.`
        },
        "01_Raw/articles/251101 고통은 낭만적이지 않다.md": {

          series: "복음과 상황 (2025년 11월호)",
          tags: ["기고문", "복음과상황", "신정론", "고통", "카오스", "욥기", "룻기", "헤세드"],
          body: `# 고통은 낭만적이지 않다\n\n> **게재 정보** : 《복음과 상황》 2025년 11월호 (통권 420호) 기고문 | **필자** : 홍동우\n\n고통은 자동으로 합력하여 선으로 완성되지 않는다. 단지 끝까지 살아남는 이에게 선으로 완성될 기회가 주어질 따름이다. 고통은 결코 낭만적이지 않다.\n\n> “in everything God works for good with those who love him.” (롬 8:28, 옛 RSV 번역)\n\n우리 삶에 일어나는 고통이 자동으로 합력(合力)하여 선으로 귀결되는 일은 일어나지 않는다. 다만 곁에 있는 벗들이 선대(헤세드)를 베풀어준다면 우리는 고통으로부터 망가지지 않을 수 있다. 고통은 분명 낭만적이지 않다. 다만 고통 가운데 곁을 지키는 이들, 그리고 끝내 고통을 이겨낸 이들의 존재는 그 자체로 낭만적이다.`

          theologians: ["[[누가]]", "[[미가]]"],
          body: `# 인간다움 (Humanity)\n\n## 1. 개념 정의\n저자의 설교와 신학적 글쓰기에서 **'인간다움'**은 구원의 본질을 규정하는 핵심 범주이다. 기독교 신앙의 구원은 인간이 세상을 탈출하여 사후 천국으로 도피하는 것이 아니라, 자본주의적 물화(Reification), 성적주의, 능력주의에 의해 파괴된 **피조물 본래의 온전한 인간성을 역사 속에서 회복하는 것**을 의미한다.\n\n## 2. 연관 문서\n- [[161030_우리는_어떻게_살아야_하는가]]\n- [[호모_쿵푸스]]`

          body: `# 이신칭의와 자격주의 해체\n\n## 1. 개념 정의\n'이신칭의'는 인간 사회와 종교 시스템을 지배하는 **'자격주의(Meritocracy)'와 '자기 의'를 근본적으로 해체하는 전복적 복음**이다. 구원은 오직 예수 그리스도의 신실하심과 십자가 은혜에만 기초한다.\n\n## 2. 원문 핵심 인용\n> [!quote] 원문 발췌\n> \"안디옥 사건은 단순히 밥을 누구랑 먹느냐의 문제가 아니라, '예수로 충분한가, 아니면 예수 외에 할례나 율법의 조건이 더 필요한가'를 판가름하는 신학적 전쟁이었기 때문입니다.\"`

          body: `# 박영선 (남포교회 원로목사)\n\n## 1. 사상적 영향\n『하나님의 열심』과 『성화의 신비』를 통해 인간의 도덕적 완전주의를 해체하고, 실패와 시간 속에서 신자를 끝까지 설복하시고 빚어가시는 하나님의 주권적 성화론을 일깨운 한국 강해설교의 거장.`

    // ==================== APPLICATION STATE ====================
    let ARCHIVE = null;
    let DOCS_MAP = {};
    let LOOKUP_INDEX = {};      // Maps basename, normalized name, YYMMDD -> doc.id
    let RAW_TO_WIKI_MAP = {};   // Maps raw doc.id -> wiki source doc.id
    let WIKI_TO_RAW_MAP = {};   // Maps wiki source doc.id -> raw doc.id
    let BACKLINKS_MAP = {};     // Maps target doc.id -> Set of source doc.ids

    let currentDocId = "02_Wiki/index.md";
    let currentFontSize = parseInt(localStorage.getItem("wiki_font_size") || "18", 10);
    let currentFontFamily = localStorage.getItem("wiki_font_family") || "serif"; // 'serif' | 'sans'
    let openFoldersState = {
      raw: {},
      wiki: {}
    };

    // ==================== INITIALIZATION ====================
    window.addEventListener("DOMContentLoaded", () => {
      initThemeAndTypography();
      bootArchiveData();
      setupKeyboardShortcuts();
    });

    function initThemeAndTypography() {
      // Theme
      const savedTheme = localStorage.getItem("wiki_theme") || "light";
      setTheme(savedTheme);

      // Font Size
      applyFontSize(currentFontSize);

      // Font Family
      applyFontFamily(currentFontFamily);

      // Mermaid Init
      if (window.mermaid) {
        mermaid.initialize({
          startOnLoad: false,
          theme: savedTheme === "dark" ? "dark" : "default",
          securityLevel: "loose"
        });
      }
    }

    function bootArchiveData(customData) {
      if (customData && customData.docs) {
        ARCHIVE = customData;
      } else if (window.ARCHIVE_DATA && window.ARCHIVE_DATA.docs) {
        ARCHIVE = window.ARCHIVE_DATA;
      } else if (window.VAULT_DATA && window.VAULT_DATA.docs) {
        ARCHIVE = window.VAULT_DATA;
      } else {
        ARCHIVE = FALLBACK_ARCHIVE_DATA;
      }

      DOCS_MAP = ARCHIVE.docs || {};
      const totalLoaded = Object.keys(DOCS_MAP).length;

      // Update Top Status Badge
      const statusText = document.getElementById("bundleStatusText");
      if (statusText) {
        statusText.textContent = totalLoaded >= 100
          ? `번들 활성 (${totalLoaded}편)`
          : `data.js 불러오기 (${totalLoaded}편)`;
      }

      const subtitleEl = document.getElementById("headerSubtitle");
      if (subtitleEl && ARCHIVE.meta && ARCHIVE.meta.subtitle) {
        subtitleEl.textContent = `${ARCHIVE.meta.subtitle} · 총 ${totalLoaded}편 수록`;
      }

      buildIndicesAndCrossMaps();
      renderBothSidebars();

      // Check URL Hash or open default index
      const hashId = decodeURIComponent(window.location.hash.replace(/^#/, ""));
      if (hashId && DOCS_MAP[hashId]) {
        navigateToDoc(hashId, false);
      } else if (DOCS_MAP["02_Wiki/index.md"]) {
        navigateToDoc("02_Wiki/index.md", false);
      } else {
        const firstKey = Object.keys(DOCS_MAP)[0];
        if (firstKey) navigateToDoc(firstKey, false);
      }
    }

    // ==================== ALLOW DIRECT FILE UPLOAD OF data.js ====================
    function loadDataJsFromFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          // Extract JSON object assigned to window.ARCHIVE_DATA
          const jsonStart = text.indexOf("{");
          const jsonEnd = text.lastIndexOf("}");
          if (jsonStart !== -1 && jsonEnd !== -1) {
            const parsed = JSON.parse(text.slice(jsonStart, jsonEnd + 1));
            window.ARCHIVE_DATA = parsed;
            bootArchiveData(parsed);
          }
        } catch (err) {
          console.error("Failed to parse data.js:", err);
        }
      };
      reader.readAsText(file, "utf-8");
    }

    // ==================== INDEXING & WIKILINK RESOLUTION ====================
    function normalizeKey(str) {
      if (!str) return "";
      return str
        .trim()
        .replace(/\.md$/i, "")
        .replace(/[\s_]+/g, "_")
        .toLowerCase();
    }

    function buildIndicesAndCrossMaps() {
      LOOKUP_INDEX = {};
      RAW_TO_WIKI_MAP = {};
      WIKI_TO_RAW_MAP = {};
      BACKLINKS_MAP = {};

      const allDocs = Object.values(DOCS_MAP);

      // 1. Register keys for fast WikiLink lookup
      allDocs.forEach(doc => {
        BACKLINKS_MAP[doc.id] = new Set();

        LOOKUP_INDEX[doc.id] = doc.id;
        LOOKUP_INDEX[doc.id.toLowerCase()] = doc.id;
        LOOKUP_INDEX[normalizeKey(doc.id)] = doc.id;

        if (doc.basename) {
          LOOKUP_INDEX[doc.basename] = doc.id;
          LOOKUP_INDEX[doc.basename.toLowerCase()] = doc.id;
          LOOKUP_INDEX[normalizeKey(doc.basename)] = doc.id;
        }
        if (doc.title) {
          LOOKUP_INDEX[doc.title] = doc.id;
          LOOKUP_INDEX[normalizeKey(doc.title)] = doc.id;
        }
        if (doc.meta && Array.isArray(doc.meta.aliases)) {
          doc.meta.aliases.forEach(alias => {
            LOOKUP_INDEX[alias] = doc.id;
            LOOKUP_INDEX[normalizeKey(alias)] = doc.id;
          });
        }
      });

      // 2. Build 1:1 RAW <-> WIKI Source Cross-Reference Map
      const rawDateMap = {};
      allDocs.filter(d => d.section === "raw").forEach(rawDoc => {
        const m = rawDoc.basename.match(/^(\d{6})/);
        if (m) rawDateMap[m[1]] = rawDoc.id;
      });

      allDocs.filter(d => d.section === "wiki" && d.category === "sources").forEach(wikiDoc => {
        const rawPath = wikiDoc.meta?.raw_path;
        if (rawPath && DOCS_MAP[rawPath]) {
          RAW_TO_WIKI_MAP[rawPath] = wikiDoc.id;
          WIKI_TO_RAW_MAP[wikiDoc.id] = rawPath;
        } else {
          const m = wikiDoc.basename.match(/^(\d{6})/);
          if (m && rawDateMap[m[1]]) {
            RAW_TO_WIKI_MAP[rawDateMap[m[1]]] = wikiDoc.id;
            WIKI_TO_RAW_MAP[wikiDoc.id] = rawDateMap[m[1]];
          }
        }
      });

      // 3. Scan WikiLinks [[...]] to populate Backlinks
      const wikiLinkRegex = /\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|([^\]]+))?\]\]/g;
      allDocs.forEach(doc => {
        if (!doc.body) return;
        let match;
        while ((match = wikiLinkRegex.exec(doc.body)) !== null) {
          const targetRaw = match[1].trim();
          const resolvedId = resolveWikiLink(targetRaw);
          if (resolvedId && resolvedId !== doc.id && BACKLINKS_MAP[resolvedId]) {
            BACKLINKS_MAP[resolvedId].add(doc.id);
          }
        }
      });
    }

    function resolveWikiLink(targetStr) {
      if (!targetStr) return null;
      const clean = targetStr.replace(/\\$/g, "").trim();
      if (DOCS_MAP[clean]) return clean;
      if (LOOKUP_INDEX[clean]) return LOOKUP_INDEX[clean];
      if (LOOKUP_INDEX[clean.toLowerCase()]) return LOOKUP_INDEX[clean.toLowerCase()];
      const norm = normalizeKey(clean);
      if (LOOKUP_INDEX[norm]) return LOOKUP_INDEX[norm];

      // Prefix match by 6-digit date (prefer wiki source, then raw)
      const dateMatch = clean.match(/^(\d{6})/);
      if (dateMatch) {
        const prefix = dateMatch[1];
        const wikiCandidate = Object.values(DOCS_MAP).find(
          d => d.section === "wiki" && d.category === "sources" && d.basename.startsWith(prefix)
        );
        if (wikiCandidate) return wikiCandidate.id;

        const rawCandidate = Object.values(DOCS_MAP).find(
          d => d.section === "raw" && d.basename.startsWith(prefix)
        );
        if (rawCandidate) return rawCandidate.id;
      }

      return null;
    }

    // ==================== SIDEBAR TREE CONSTRUCTION & RENDERING ====================
    function renderBothSidebars(filterKeyword = "") {
      const kw = filterKeyword.trim().toLowerCase();
      const allDocs = Object.values(DOCS_MAP);

      // Filter helper
      const matchesFilter = (doc) => {
        if (!kw) return true;
        return (
          (doc.title && doc.title.toLowerCase().includes(kw)) ||
          (doc.basename && doc.basename.toLowerCase().includes(kw)) ||
          (doc.path && doc.path.toLowerCase().includes(kw)) ||
          (doc.series && doc.series.toLowerCase().includes(kw))
        );
      };

      // ---------- 1. Render Upper Sidebar: RAW (01_Raw) ----------
      const rawDocs = allDocs.filter(d => d.section === "raw" && matchesFilter(d));
      document.getElementById("rawCountBadge").textContent = rawDocs.length;

      // Group RAW docs by folder hierarchy
      // Path e.g. "01_Raw/Sermons/1. 2016-2019 Y교회/161030 우리파워교회.md"
      // or "01_Raw/Sermons/2. 2021-2023 C교회/211017-211114 갈라디아서 강해/211017.md"
      // or "01_Raw/articles/220322 계시록과 만나다.md"
      const rawGroups = {};
      rawDocs.forEach(doc => {
        const parts = doc.path.split("/");
        let groupTitle = "기타 자료";
        let subGroupTitle = null;

        if (parts[1] === "Sermons") {
          groupTitle = `📖 ${parts[2] || "설교 모음"}`;
          if (parts.length > 4) {
            subGroupTitle = parts.slice(3, parts.length - 1).join(" / ");
          }
        } else if (parts[1] === "articles") {
          groupTitle = "✒️ 외부 기고문 및 서평 (Articles)";
        }

        if (!rawGroups[groupTitle]) {
          rawGroups[groupTitle] = { direct: [], subGroups: {} };
        }
        if (subGroupTitle) {
          if (!rawGroups[groupTitle].subGroups[subGroupTitle]) {
            rawGroups[groupTitle].subGroups[subGroupTitle] = [];
          }
          rawGroups[groupTitle].subGroups[subGroupTitle].push(doc);
        } else {
          rawGroups[groupTitle].direct.push(doc);
        }
      });

      const rawContainer = document.getElementById("rawMenuContainer");
      rawContainer.innerHTML = "";

      Object.keys(rawGroups).sort().forEach((gKey, idx) => {
        const group = rawGroups[gKey];
        const totalInGroup =
          group.direct.length +
          Object.values(group.subGroups).reduce((acc, arr) => acc + arr.length, 0);

        const folderId = `raw_folder_${idx}`;
        const isOpen = kw ? true : (openFoldersState.raw[folderId] ?? (idx === 0));

        const detailsEl = document.createElement("details");
        detailsEl.className = "group/folder rounded-lg overflow-hidden";
        if (isOpen) detailsEl.open = true;
        detailsEl.addEventListener("toggle", () => {
          openFoldersState.raw[folderId] = detailsEl.open;
        });

        detailsEl.innerHTML = `
          <summary class="flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer font-semibold text-slate-700 dark:text-slate-200 hover:bg-amber-500/10 dark:hover:bg-slate-800 transition-colors list-none">
            <span class="flex items-center gap-1.5 truncate">
              <svg class="w-3.5 h-3.5 text-amber-600 dark:text-amber-400 transition-transform group-open/folder:rotate-90 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
              <span class="truncate">${escapeHtml(gKey)}</span>
            </span>
            <span class="text-[10px] font-mono text-slate-400 dark:text-slate-500 ml-2">${totalInGroup}</span>
          </summary>
          <div class="pl-3 pr-1 py-1 space-y-1 border-l border-amber-500/20 ml-3 mt-0.5" id="${folderId}_content"></div>
        `;

        const contentBox = detailsEl.querySelector(`#${folderId}_content`);

        // Render Direct Items
        group.direct.sort((a, b) => a.basename.localeCompare(b.basename)).forEach(doc => {
          contentBox.appendChild(createSidebarDocItem(doc, "amber"));
        });

        // Render Sub-groups
        Object.keys(group.subGroups).sort().forEach((subKey, sIdx) => {
          const subDocs = group.subGroups[subKey];
          const subId = `${folderId}_sub_${sIdx}`;
          const subOpen = kw ? true : (openFoldersState.raw[subId] ?? false);

          const subDetails = document.createElement("details");
          subDetails.className = "group/sub rounded-md";
          if (subOpen) subDetails.open = true;
          subDetails.addEventListener("toggle", () => {
            openFoldersState.raw[subId] = subDetails.open;
          });

          subDetails.innerHTML = `
            <summary class="flex items-center justify-between px-2 py-1 rounded-md cursor-pointer font-medium text-slate-600 dark:text-slate-300 hover:bg-stone-200/60 dark:hover:bg-slate-800/60 transition-colors list-none">
              <span class="flex items-center gap-1.5 truncate">
                <svg class="w-3 h-3 text-slate-400 transition-transform group-open/sub:rotate-90 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
                <span class="truncate">📁 ${escapeHtml(subKey)}</span>
              </span>
              <span class="text-[10px] font-mono text-slate-400">${subDocs.length}</span>
            </summary>
            <div class="pl-3 py-0.5 space-y-0.5 border-l border-stone-300 dark:border-slate-700 ml-2.5 mt-0.5"></div>
          `;

          const subList = subDetails.querySelector("div");
          subDocs.sort((a, b) => a.basename.localeCompare(b.basename)).forEach(doc => {
            subList.appendChild(createSidebarDocItem(doc, "amber"));
          });
          contentBox.appendChild(subDetails);
        });

        rawContainer.appendChild(detailsEl);
      });

      // ---------- 2. Render Lower Sidebar: WIKI (02_Wiki) ----------
      const wikiDocs = allDocs.filter(d => d.section === "wiki" && matchesFilter(d));
      document.getElementById("wikiCountBadge").textContent = wikiDocs.length;

      const wikiCategories = [
        { key: "index_log", label: "📌 마스터 카탈로그 & 작업 로그", filter: d => d.category === "index" || d.category === "log", defaultOpen: true },
        { key: "synthesis", label: "📊 시대별·주제별 종합 보고서", filter: d => d.category === "synthesis", defaultOpen: true },
        { key: "series", label: "📚 연속 강해 시리즈 종합 노트", filter: d => d.category === "series", defaultOpen: false },
        { key: "concepts", label: "💡 핵심 신학 개념 사전 (Concepts)", filter: d => d.category === "concepts", defaultOpen: false },
        { key: "theologians", label: "🎓 신학자 및 사상가 (Theologians)", filter: d => d.category === "theologians", defaultOpen: false },
        { key: "sources", label: "🔍 개별 설교·기고문 분석 (Sources)", filter: d => d.category === "sources", defaultOpen: false }
      ];

      const wikiContainer = document.getElementById("wikiMenuContainer");
      wikiContainer.innerHTML = "";

      wikiCategories.forEach(cat => {
        const items = wikiDocs.filter(cat.filter);
        if (items.length === 0) return;

        const folderId = `wiki_folder_${cat.key}`;
        const isOpen = kw ? true : (openFoldersState.wiki[folderId] ?? cat.defaultOpen);

        const detailsEl = document.createElement("details");
        detailsEl.className = "group/wfolder rounded-lg overflow-hidden";
        if (isOpen) detailsEl.open = true;
        detailsEl.addEventListener("toggle", () => {
          openFoldersState.wiki[folderId] = detailsEl.open;
        });

        detailsEl.innerHTML = `
          <summary class="flex items-center justify-between px-2.5 py-1.5 rounded-lg cursor-pointer font-semibold text-slate-700 dark:text-slate-200 hover:bg-indigo-500/10 dark:hover:bg-slate-800 transition-colors list-none">
            <span class="flex items-center gap-1.5 truncate">
              <svg class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400 transition-transform group-open/wfolder:rotate-90 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
              <span class="truncate">${escapeHtml(cat.label)}</span>
            </span>
            <span class="text-[10px] font-mono text-slate-400 dark:text-slate-500 ml-2">${items.length}</span>
          </summary>
          <div class="pl-3 pr-1 py-1 space-y-0.5 border-l border-indigo-500/20 ml-3 mt-0.5"></div>
        `;

        const listBox = detailsEl.querySelector("div");
        items.sort((a, b) => a.basename.localeCompare(b.basename)).forEach(doc => {
          listBox.appendChild(createSidebarDocItem(doc, "indigo"));
        });

        wikiContainer.appendChild(detailsEl);
      });
    }

    function createSidebarDocItem(doc, accentColor = "indigo") {
      const btn = document.createElement("button");
      btn.setAttribute("data-doc-id", doc.id);
      const isActive = doc.id === currentDocId;

      const activeClasses = accentColor === "amber"
        ? "bg-amber-500/20 text-amber-950 dark:text-amber-200 font-bold border-l-2 border-amber-600"
        : "bg-indigo-500/20 text-indigo-950 dark:text-indigo-200 font-bold border-l-2 border-indigo-600";

      const inactiveClasses = "text-slate-600 dark:text-slate-400 hover:bg-stone-200/70 dark:hover:bg-slate-800/70 hover:text-slate-900 dark:hover:text-slate-100";

      btn.className = `w-full text-left px-2.5 py-1.5 rounded-md transition-all flex items-start gap-1.5 group ${isActive ? activeClasses : inactiveClasses}`;
      btn.onclick = () => {
        navigateToDoc(doc.id);
        closeMobileSidebar();
      };

      const displayLabel = doc.basename.replace(/_/g, " ");
      const subTitle = doc.title && doc.title !== doc.basename ? doc.title : "";

      btn.innerHTML = `
        <span class="mt-0.5 text-[10px] opacity-60 shrink-0">${doc.section === "raw" ? "📄" : "💠"}</span>
        <div class="min-w-0 flex-1">
          <div class="truncate leading-snug">${escapeHtml(displayLabel)}</div>
          ${subTitle ? `<div class="truncate text-[10px] opacity-70 leading-tight mt-0.5">${escapeHtml(subTitle)}</div>` : ""}
        </div>
      `;
      return btn;
    }

    function filterSidebarTree(val) {
      renderBothSidebars(val);
    }

    function toggleAllFolders(section, openState) {
      const containerId = section === "raw" ? "rawMenuContainer" : "wikiMenuContainer";
      const container = document.getElementById(containerId);
      if (!container) return;
      container.querySelectorAll("details").forEach(d => {
        d.open = openState;
      });
    }

    // ==================== NAVIGATION & DOCUMENT RENDERING ====================
    function navigateToDoc(docId, pushHash = true) {
      const doc = DOCS_MAP[docId];
      if (!doc) return;

      currentDocId = docId;
      if (pushHash) {
        history.replaceState(null, "", `#${encodeURIComponent(docId)}`);
      }

      // Highlight active item in sidebar & auto-open its parent <details>
      document.querySelectorAll("[data-doc-id]").forEach(el => {
        const id = el.getAttribute("data-doc-id");
        const isRaw = DOCS_MAP[id]?.section === "raw";
        if (id === docId) {
          el.className = `w-full text-left px-2.5 py-1.5 rounded-md transition-all flex items-start gap-1.5 group ${
            isRaw
              ? "bg-amber-500/20 text-amber-950 dark:text-amber-200 font-bold border-l-2 border-amber-600"
              : "bg-indigo-500/20 text-indigo-950 dark:text-indigo-200 font-bold border-l-2 border-indigo-600"
          }`;
          // Open parent details
          let parent = el.parentElement;
          while (parent) {
            if (parent.tagName === "DETAILS") parent.open = true;
            parent = parent.parentElement;
          }
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } else {
          el.className = "w-full text-left px-2.5 py-1.5 rounded-md transition-all flex items-start gap-1.5 group text-slate-600 dark:text-slate-400 hover:bg-stone-200/70 dark:hover:bg-slate-800/70 hover:text-slate-900 dark:hover:text-slate-100";
        }
      });

      renderDocumentHeader(doc);
      renderDocumentBody(doc);
      renderDocumentBacklinks(doc);

      // Scroll main area to top
      document.getElementById("mainScrollArea").scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderDocumentHeader(doc) {
      // 1. Breadcrumb
      const parts = doc.path.split("/");
      const breadcrumbEl = document.getElementById("docBreadcrumb");
      const sectionBadge = doc.section === "raw"
        ? `<span class="px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-800 dark:text-amber-300 font-bold">01_RAW 원문</span>`
        : `<span class="px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-800 dark:text-indigo-300 font-bold">02_WIKI 지식베이스</span>`;

      const trail = parts.slice(1, parts.length - 1).map(p => `<span>${escapeHtml(p)}</span>`).join(`<span class="opacity-40">/</span>`);
      breadcrumbEl.innerHTML = `${sectionBadge} ${trail ? `<span class="opacity-40">/</span> ${trail}` : ""}`;

      // 2. Smart Cross-Switch Button (RAW <-> WIKI)
      const switchContainer = document.getElementById("crossSwitchContainer");
      switchContainer.innerHTML = "";

      if (doc.section === "raw" && RAW_TO_WIKI_MAP[doc.id]) {
        const targetWikiId = RAW_TO_WIKI_MAP[doc.id];
        switchContainer.innerHTML = `
          <button onclick="navigateToDoc('${escapeJsStr(targetWikiId)}')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-1.5 transition-all">
            <span>🧠 WIKI 신학 분석 노트 보기</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        `;
      } else if (doc.section === "wiki" && WIKI_TO_RAW_MAP[doc.id]) {
        const targetRawId = WIKI_TO_RAW_MAP[doc.id];
        switchContainer.innerHTML = `
          <button onclick="navigateToDoc('${escapeJsStr(targetRawId)}')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-700 text-white shadow-sm flex items-center gap-1.5 transition-all">
            <span>📖 RAW 원본 설교문 전문 보기</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        `;

      // 3. Metadata Summary Card
      const metaCard = document.getElementById("docMetaCard");
      const scriptures = (doc.scripture && doc.scripture.length)
        ? doc.scripture
        : (Array.isArray(doc.meta?.scripture) ? doc.meta.scripture : (doc.meta?.bible_text || []));

      const tags = (doc.tags && doc.tags.length)
        ? doc.tags
        : (Array.isArray(doc.meta?.tags) ? doc.meta.tags : []);

      const theologians = (doc.theologians && doc.theologians.length)
        ? doc.theologians
        : (Array.isArray(doc.meta?.theologians) ? doc.meta.theologians : (doc.meta?.related_theologians || []));

      const concepts = (doc.concepts && doc.concepts.length)
        ? doc.concepts
        : (Array.isArray(doc.meta?.concepts) ? doc.meta.concepts : []);

      const dateStr = doc.date || doc.meta?.created || doc.meta?.date || "";
      const seriesStr = doc.series || doc.meta?.series || "";
      const audienceStr = doc.audience || doc.meta?.audience || "";
      const subjectStr = doc.subject || doc.meta?.subject || "";

      const hasRichMeta = dateStr || seriesStr || audienceStr || subjectStr || scriptures.length > 0 || theologians.length > 0 || concepts.length > 0 || tags.length > 0;

      if (!hasRichMeta) {
        metaCard.innerHTML = "";
        return;
      }

      metaCard.innerHTML = `
        <div class="rounded-2xl bg-white dark:bg-slate-900 border border-stone-200/90 dark:border-slate-800 p-4 sm:p-5 shadow-xs space-y-3">
          <div class="flex flex-wrap items-center gap-2 text-xs">
            ${dateStr ? `<span class="px-2.5 py-1 rounded-lg bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono font-medium">📅 ${escapeHtml(String(dateStr))}</span>` : ""}
            ${seriesStr ? `<span class="px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 font-semibold">📚 ${ renderInlineWikiLinks(String(seriesStr)) }</span>` : ""}
            ${audienceStr ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-medium">👥 ${escapeHtml(String(audienceStr))}</span>` : ""}
            ${scriptures.map(s => `<span class="px-2.5 py-1 rounded-lg bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 font-semibold">✝️ ${escapeHtml(String(s))}</span>`).join("")}
          </div>

          ${subjectStr ? `
            <div class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 bg-stone-50 dark:bg-slate-800/50 px-3.5 py-2.5 rounded-xl border border-stone-200/60 dark:border-slate-700/50">
              <strong class="text-slate-800 dark:text-slate-100 mr-1.5">핵심 주제:</strong>${escapeHtml(String(subjectStr))}
            </div>
          ` : ""}

          ${(theologians.length > 0 || concepts.length > 0) ? `
            <div class="flex flex-wrap items-center gap-1.5 pt-1 text-xs">
              ${theologians.map(t => `<span class="inline-flex items-center">${renderInlineWikiLinks(t.includes("[[") ? t : `[[${t}]]`)}</span>`).join("")}

          ${tags.length > 0 ? `

              ${tags.map(tag => `<button onclick="triggerTagSearch('${escapeJsStr(tag)}')" class="text-[11px] px-2 py-0.5 rounded-full bg-stone-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors">#${escapeHtml(String(tag))}</button>`).join("")}
            </div>
          ` : ""}
        </div>
      `;
    }

    // ==================== MARKDOWN & OBSIDIAN WIKI PARSER ====================
    function renderDocumentBody(doc) {
      const container = document.getElementById("docBodyContainer");
      const rawMarkdown = doc.body || "";

      container.innerHTML = parseObsidianMarkdown(rawMarkdown);

      // Render Mermaid flowcharts if present
      if (window.mermaid) {
        const mermaidNodes = container.querySelectorAll(".mermaid");
        if (mermaidNodes.length > 0) {
          mermaid.run({ nodes: mermaidNodes }).catch(err => console.warn("Mermaid render notice:", err));
        }
      }
    }

    function parseObsidianMarkdown(md) {
      if (!md) return "<p class='text-slate-400'>내용이 없습니다.</p>";

      const lines = md.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        // 1. Fenced Code Blocks (including ```mermaid)
        if (line.trim().startsWith("```")) {
          const lang = line.trim().slice(3).trim().toLowerCase();
          const codeLines = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            codeLines.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const codeContent = codeLines.join("\n");
          if (lang === "mermaid") {
            html += `<div class="my-6 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 overflow-x-auto flex justify-center"><div class="mermaid">${escapeHtml(codeContent)}</div></div>`;
          } else {
            html += `<pre><code>${escapeHtml(codeContent)}</code></pre>`;
          }
          continue;
        }

        // 2. Markdown Tables
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])) {
          const headerCells = splitTableLine(lines[i]);
          i += 2; // skip header & separator line
          const bodyRows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            bodyRows.push(splitTableLine(lines[i]));
            i++;
          }
          html += `<div class="overflow-x-auto my-5"><table><thead><tr>${
            headerCells.map(c => `<th>${formatInlineMarkdown(c)}</th>`).join("")
          }</tr></thead><tbody>${
            bodyRows.map(row => `<tr>${row.map(c => `<td>${formatInlineMarkdown(c)}</td>`).join("")}</tr>`).join("")
          }</tbody></table></div>`;
          continue;
        }

        // 3. Blockquotes & Obsidian Callouts (> [!quote], > [!tip], > [!abstract], etc.)
        if (/^\s*>\s?/.test(line)) {
          const quoteLines = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
            quoteLines.push(lines[i].replace(/^\s*>\s?/, ""));
            i++;
          }

          const firstQuoteLine = quoteLines[0] || "";
          const calloutMatch = firstQuoteLine.match(/^\[!(\w+)\]\s*(.*)$/);

          if (calloutMatch) {
            const calloutType = calloutMatch[1].toLowerCase();
            const calloutTitle = calloutMatch[2] || calloutType.toUpperCase();
            const innerBody = quoteLines.slice(1).join("\n");

            const styleMap = {
              quote: { border: "border-indigo-500", bg: "bg-indigo-50/70 dark:bg-indigo-950/30", titleColor: "text-indigo-800 dark:text-indigo-300", icon: "💬" },
              abstract: { border: "border-emerald-500", bg: "bg-emerald-50/70 dark:bg-emerald-950/30", titleColor: "text-emerald-800 dark:text-emerald-300", icon: "📋" },
              tip: { border: "border-amber-500", bg: "bg-amber-50/70 dark:bg-amber-950/30", titleColor: "text-amber-800 dark:text-amber-300", icon: "💡" },
              question: { border: "border-rose-500", bg: "bg-rose-50/70 dark:bg-rose-950/30", titleColor: "text-rose-800 dark:text-rose-300", icon: "❓" }
            };
            const st = styleMap[calloutType] || styleMap.quote;

            html += `
              <div class="my-5 rounded-xl border-l-4 ${st.border} ${st.bg} p-4 sm:p-5 shadow-2xs">
                <div class="flex items-center gap-2 font-bold text-sm ${st.titleColor} mb-2">
                  <span>${st.icon}</span>
                  <span>${formatInlineMarkdown(calloutTitle)}</span>
                </div>
                <div class="text-[0.96em] space-y-2">${parseObsidianMarkdown(innerBody)}</div>
              </div>
            `;
          } else {
            html += `<blockquote>${parseObsidianMarkdown(quoteLines.join("\n"))}</blockquote>`;
          }
          continue;
        }

        // 4. Horizontal Rule
        if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
          html += `<hr />`;
          i++;
          continue;
        }

        // 5. Headings (# ~ ####)
        const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (headingMatch) {
          const level = headingMatch[1].length;
          const content = formatInlineMarkdown(headingMatch[2].trim());
          html += `<h${level}>${content}</h${level}>`;
          i++;
          continue;
        }

        // 6. Unordered Lists
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*+]\s+/, ""));
            i++;
          }
          html += `<ul>${items.map(it => `<li>${formatInlineMarkdown(it)}</li>`).join("")}</ul>`;
          continue;
        }

        // 7. Ordered Lists
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
            i++;
          }
          html += `<ol>${items.map(it => `<li>${formatInlineMarkdown(it)}</li>`).join("")}</ol>`;
          continue;
        }

        // 8. Footnote definition [^1]: ...
        const fnMatch = line.match(/^\[\^([^\]]+)\]:\s*(.+)$/);
        if (fnMatch) {
          html += `<div class="text-xs text-slate-500 dark:text-slate-400 py-1 border-t border-stone-200/50 dark:border-slate-800/50"><strong class="text-indigo-600 dark:text-indigo-400">[${escapeHtml(fnMatch[1])}]</strong> ${formatInlineMarkdown(fnMatch[2])}</div>`;
          i++;
          continue;
        }

        // 9. Blank Line
        if (!line.trim()) {
          i++;
          continue;
        }

        // 10. Standard Paragraph
        const paraLines = [];
        while (
          i < lines.length &&
          lines[i].trim() !== "" &&
          !lines[i].trim().startsWith("```") &&
          !lines[i].trim().startsWith("|") &&
          !/^\s*>\s?/.test(lines[i]) &&
          !/^(#{1,4})\s+/.test(lines[i]) &&
          !/^\s*(---+|\*\*\*+|___+)\s*$/.test(lines[i]) &&
          !/^\s*[-*+]\s+/.test(lines[i]) &&
          !/^\s*\d+[.)]\s+/.test(lines[i])
        ) {
          paraLines.push(lines[i]);
          i++;
        }
        html += `<p>${formatInlineMarkdown(paraLines.join("<br/>"))}</p>`;
      }

      return html;
    }

    function splitTableLine(line) {
      let trimmed = line.trim();
      if (trimmed.startsWith("|")) trimmed = trimmed.slice(1);
      if (trimmed.endsWith("|")) trimmed = trimmed.slice(0, -1);
      // Split by | not preceded by \
      return trimmed.split(/(?<!\\)\|/).map(cell => cell.replace(/\\\|/g, "|").trim());
    }

    function formatInlineMarkdown(text) {
      if (!text) return "";

      // Preserve inline code spans first
      const codeSpans = [];
      let processed = text.replace(/`([^`]+)`/g, (_, code) => {
        codeSpans.push(`<code>${escapeHtml(code)}</code>`);
        return `@@CODESPAN_${codeSpans.length - 1}@@`;
      });

      // Preserve WikiLinks [[target|alias]] or [[target]]
      const wikiSpans = [];
      processed = processed.replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|([^\]]+))?\]\]/g, (_, target, alias) => {
        const cleanTarget = target.replace(/\\$/g, "").trim();
        const label = (alias || cleanTarget).replace(/_/g, " ").trim();
        const resolvedId = resolveWikiLink(cleanTarget);

        if (resolvedId) {
          wikiSpans.push(
            `<a href="#${encodeURIComponent(resolvedId)}" onclick="event.preventDefault(); navigateToDoc('${escapeJsStr(resolvedId)}')" class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-md bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 font-semibold underline decoration-indigo-400/50 underline-offset-4 transition-colors">${escapeHtml(label)}</a>`
          );
        } else {
          wikiSpans.push(
            `<button onclick="triggerTagSearch('${escapeJsStr(label)}')" title="아카이브 검색: ${escapeHtml(label)}" class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-md bg-stone-200/70 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-indigo-500/15 hover:text-indigo-600 font-medium transition-colors">${escapeHtml(label)}</button>`
          );
        }
        return `@@WIKISPAN_${wikiSpans.length - 1}@@`;
      });

      // Escape HTML except <br/>
      processed = escapeHtml(processed).replace(/&lt;br\/&gt;/g, "<br/>");

      // Bold & Italic
      processed = processed.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
      processed = processed.replace(/\*\*([^*]+)\*\*/g, "<strong class='font-bold text-slate-900 dark:text-white'>$1</strong>");
      processed = processed.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");

      // Footnote refs [^1]
      processed = processed.replace(/\[\^([^\]]+)\]/g, "<sup class='text-indigo-600 dark:text-indigo-400 font-mono font-bold ml-0.5'>[$1]</sup>");

      // Standard Markdown links [label](url)
      processed = processed.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, `<a href="$2" target="_blank" rel="noopener" class="text-indigo-600 dark:text-indigo-400 underline hover:text-indigo-800">$1 ↗</a>`);

      // Restore WikiSpans and CodeSpans
      processed = processed.replace(/@@WIKISPAN_(\d+)@@/g, (_, idx) => wikiSpans[Number(idx)]);
      processed = processed.replace(/@@CODESPAN_(\d+)@@/g, (_, idx) => codeSpans[Number(idx)]);

      return processed;
    }

    function renderInlineWikiLinks(str) {
      return formatInlineMarkdown(str);
    }

    // ==================== BACKLINKS & RELATED DOCUMENTS ====================
    function renderDocumentBacklinks(doc) {
      const box = document.getElementById("docBacklinksContainer");
      const backlinkIds = Array.from(BACKLINKS_MAP[doc.id] || []);

      // Also find related documents sharing the same series (if any)
      const sameSeriesDocs = doc.series
        ? Object.values(DOCS_MAP).filter(d => d.id !== doc.id && d.series === doc.series).slice(0, 8)
        : [];

      if (backlinkIds.length === 0 && sameSeriesDocs.length === 0) {
        box.innerHTML = "";
        return;
      }

      let html = `<div class="space-y-6">`;

      if (backlinkIds.length > 0) {
        html += `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 flex items-center gap-1.5">
              <span>🔗 이 문서를 참조하는 연결 문서 (Backlinks · ${backlinkIds.length})</span>
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${backlinkIds.map(id => {
                const bDoc = DOCS_MAP[id];
                if (!bDoc) return "";
                return `
                  <div onclick="navigateToDoc('${escapeJsStr(bDoc.id)}')" class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-stone-200/80 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-indigo-500 cursor-pointer transition-all shadow-2xs">
                    <div class="flex items-center gap-1.5 text-[11px] text-indigo-600 dark:text-indigo-400 font-semibold">
                      <span>${bDoc.section === "raw" ? "📖 RAW" : "🧠 WIKI"}</span>
                      <span>·</span>
                      <span class="truncate">${escapeHtml(bDoc.category)}</span>
                    </div>
                    <div class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 truncate mt-0.5">${escapeHtml(bDoc.title || bDoc.basename)}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      if (sameSeriesDocs.length > 0) {
        html += `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">
              📚 같은 시리즈 설교/문서 (${escapeHtml(doc.series)})
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${sameSeriesDocs.map(sDoc => `
                <div onclick="navigateToDoc('${escapeJsStr(sDoc.id)}')" class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-stone-200/80 dark:border-slate-800 hover:border-amber-500 cursor-pointer transition-all shadow-2xs">
                  <div class="text-[11px] text-amber-700 dark:text-amber-400 font-mono">${escapeHtml(sDoc.date || sDoc.basename)}</div>
                  <div class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 truncate mt-0.5">${escapeHtml(sDoc.title || sDoc.basename)}</div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      box.innerHTML = html;
    }

    // ==================== GLOBAL SEARCH ENGINE ====================
    function handleSearchInput(query) {
      const dropdown = document.getElementById("searchDropdown");
      const clearBtn = document.getElementById("clearSearchBtn");
      const q = query.trim().toLowerCase();

      if (!q) {
        dropdown.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");
      dropdown.classList.remove("hidden");

      const results = [];
      for (const doc of Object.values(DOCS_MAP)) {
        let score = 0;
        const title = (doc.title || "").toLowerCase();
        const base = (doc.basename || "").toLowerCase();
        const subj = (doc.subject || "").toLowerCase();
        const scrip = (doc.scripture || []).join(" ").toLowerCase();
        const tags = (doc.tags || []).join(" ").toLowerCase();
        const body = (doc.body || "").toLowerCase();

        if (title.includes(q) || base.includes(q)) score += 10;
        if (scrip.includes(q) || tags.includes(q)) score += 7;
        if (subj.includes(q)) score += 5;
        if (body.includes(q)) score += 2;

        if (score > 0) {
          results.push({ doc, score });
        }
      }

      results.sort((a, b) => b.score - a.score);
      const topResults = results.slice(0, 25);

      if (topResults.length === 0) {
        dropdown.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">검색 결과가 없습니다: "${escapeHtml(query)}"</div>`;
        return;
      }

      dropdown.innerHTML = topResults.map(({ doc }) => {
        const badge = doc.section === "raw"
          ? `<span class="px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-700 dark:text-amber-300 text-[10px] font-bold">RAW</span>`
          : `<span class="px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-700 dark:text-indigo-300 text-[10px] font-bold">WIKI</span>`;

        return `
          <div onclick="selectSearchResult('${escapeJsStr(doc.id)}')" class="p-3 hover:bg-stone-100 dark:hover:bg-slate-800 cursor-pointer transition-colors">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                ${badge}
                <span class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">${escapeHtml(doc.title || doc.basename)}</span>
              </div>
              <span class="text-[10px] font-mono text-slate-400 shrink-0">${escapeHtml(doc.date || doc.category)}</span>
            </div>
            ${doc.subject ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-1">${escapeHtml(doc.subject)}</p>` : ""}
          </div>
        `;
      }).join("");
    }

    function selectSearchResult(docId) {
      document.getElementById("searchDropdown").classList.add("hidden");
      navigateToDoc(docId);
    }

    function clearSearch() {
      const input = document.getElementById("globalSearchInput");
      input.value = "";
      handleSearchInput("");
    }

    function triggerTagSearch(tagStr) {
      const input = document.getElementById("globalSearchInput");
      input.value = tagStr;
      input.focus();
      handleSearchInput(tagStr);
    }

    // Close search dropdown when clicking outside
    document.addEventListener("click", (e) => {
      const dropdown = document.getElementById("searchDropdown");
      const input = document.getElementById("globalSearchInput");
      if (dropdown && !dropdown.contains(e.target) && e.target !== input) {
        dropdown.classList.add("hidden");
      }
    });

    // ==================== FONT SIZE, FONT FAMILY & THEME CONTROLS ====================
    function adjustFontSize(delta) {
      currentFontSize = Math.min(26, Math.max(14, currentFontSize + delta));
      localStorage.setItem("wiki_font_size", String(currentFontSize));
      applyFontSize(currentFontSize);
    }

    function applyFontSize(sizePx) {
      document.documentElement.style.setProperty("--doc-font-size", `${sizePx}px`);
      const disp = document.getElementById("fontSizeDisplay");
      if (disp) disp.textContent = `${sizePx}`;
    }

    function toggleFontFamily() {
      currentFontFamily = currentFontFamily === "serif" ? "sans" : "serif";
      localStorage.setItem("wiki_font_family", currentFontFamily);
      applyFontFamily(currentFontFamily);
    }

    function applyFontFamily(family) {
      const article = document.getElementById("docBodyContainer");
      const label = document.getElementById("fontFamilyLabel");
      if (family === "serif") {
        article.classList.remove("font-sans");
        article.classList.add("font-serif");
        if (label) label.textContent = "명조";
      } else {
        article.classList.remove("font-serif");
        article.classList.add("font-sans");
        if (label) label.textContent = "고딕";
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("dark");
      setTheme(isDark ? "light" : "dark");
    }

    function setTheme(mode) {
      const root = document.documentElement;
      const sunIcon = document.getElementById("sunIcon");
      const moonIcon = document.getElementById("moonIcon");

      if (mode === "dark") {
        root.classList.add("dark");
        root.classList.remove("light");
        sunIcon?.classList.remove("hidden");
        moonIcon?.classList.add("hidden");
      } else {
        root.classList.remove("dark");
        root.classList.add("light");
        sunIcon?.classList.add("hidden");
        moonIcon?.classList.remove("hidden");
      }
      localStorage.setItem("wiki_theme", mode);
    }

    // ==================== MOBILE DRAWER CONTROLS ====================
    function toggleMobileSidebar() {
      const sidebar = document.getElementById("leftSidebar");
      const backdrop = document.getElementById("mobileBackdrop");
      const isHidden = sidebar.classList.contains("-translate-x-full");
      if (isHidden) {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        closeMobileSidebar();
      }
    }

    function closeMobileSidebar() {
      const sidebar = document.getElementById("leftSidebar");
      const backdrop = document.getElementById("mobileBackdrop");
      sidebar.classList.add("-translate-x-full");
      backdrop.classList.add("hidden");
    }

    // ==================== KEYBOARD SHORTCUTS ====================
    function setupKeyboardShortcuts() {
      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
          e.preventDefault();
          document.getElementById("globalSearchInput")?.focus();
        } else if (e.key === "Escape") {
          document.getElementById("searchDropdown")?.classList.add("hidden");
          closeMobileSidebar();
        }
      });
    }

    // ==================== UTILITIES ====================
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsStr(str) {
      if (!str) return "";
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }
  </script>
