<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홍동우 목사의 설교 저장소 — 신학 및 설교 아카이브 (2016–2026)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            serif: ['"Noto Serif KR"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            parchment: {
              50: '#fcfbf9',
              100: '#f7f4ee',
              200: '#eee8dc',
              300: '#dfd5c3'
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Load External data.js Automatically -->
  <script src="./data.js"></script>

  <style>
    :root {
      --doc-font-size: 18px;
      --doc-line-height: 1.88;
    }

    .bg-archive-pattern {
      background-image:
        radial-gradient(rgba(99, 102, 241, 0.11) 1px, transparent 1px),
        linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }
    .dark .bg-archive-pattern {
      background-image:
        radial-gradient(rgba(129, 140, 248, 0.14) 1px, transparent 1px),
        linear-gradient(to right, rgba(51, 65, 85, 0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.18) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }

    .aurora-glow-header {
      background:
        radial-gradient(600px circle at 18% 0%, rgba(99, 102, 241, 0.16), transparent 70%),
        radial-gradient(550px circle at 82% 0%, rgba(245, 158, 11, 0.13), transparent 70%),
        radial-gradient(450px circle at 52% -10%, rgba(168, 85, 247, 0.12), transparent 65%);
    }
    .dark .aurora-glow-header {
      background:
        radial-gradient(650px circle at 18% 0%, rgba(99, 102, 241, 0.24), transparent 72%),
        radial-gradient(550px circle at 82% 0%, rgba(245, 158, 11, 0.16), transparent 72%),
        radial-gradient(500px circle at 52% -10%, rgba(139, 92, 246, 0.20), transparent 68%);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 4px 24px -4px rgba(15, 23, 42, 0.04), inset 0 1px 0 0 rgba(255, 255, 255, 0.6);
    }
    .dark .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(51, 65, 85, 0.75);
      box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    .bento-card {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
    }
    .bento-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px -8px rgba(79, 70, 229, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
    }
    .dark .bento-card:hover {
      box-shadow: 0 14px 32px -8px rgba(99, 102, 241, 0.22), 0 4px 12px -2px rgba(0, 0, 0, 0.45);
    }

    .capsule-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .capsule-pill:hover {
      transform: translateY(-1px);
    }

    .tree-guide-line {
      position: relative;
    }
    .tree-guide-line::before {
      content: "";
      position: absolute;
      left: 0.55rem;
      top: 0.25rem;
      bottom: 0.35rem;
      width: 1px;
      background: linear-gradient(to bottom, rgba(148, 163, 184, 0.45), rgba(148, 163, 184, 0.12));
    }
    .dark .tree-guide-line::before {
      background: linear-gradient(to bottom, rgba(100, 116, 139, 0.5), rgba(71, 85, 105, 0.15));
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.65);
    }

    .wiki-prose {
      font-size: var(--doc-font-size);
      line-height: var(--doc-line-height);
      word-break: keep-all;
      overflow-wrap: break-word;
      letter-spacing: -0.01em;
    }
    .wiki-prose h1 {
      font-size: 1.8em;
      font-weight: 800;
      line-height: 1.35;
      margin-top: 0.4em;
      margin-bottom: 0.8em;
      letter-spacing: -0.025em;
    }
    .wiki-prose h2 {
      font-size: 1.38em;
      font-weight: 700;
      line-height: 1.4;
      margin-top: 2em;
      margin-bottom: 0.75em;
      padding-bottom: 0.4em;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      letter-spacing: -0.02em;
      scroll-margin-top: 2rem;
    }
    .wiki-prose h3 {
      font-size: 1.16em;
      font-weight: 700;
      line-height: 1.45;
      margin-top: 1.5em;
      margin-bottom: 0.55em;
      scroll-margin-top: 2rem;
    }
    .wiki-prose p {
      margin-bottom: 1.2em;
    }
    .wiki-prose ul, .wiki-prose ol {
      margin-top: 0.5em;
      margin-bottom: 1.2em;
      padding-left: 1.5em;
    }
    .wiki-prose ul ul, .wiki-prose ol ul, .wiki-prose ul ol, .wiki-prose ol ol {
      margin-top: 0.35em;
      margin-bottom: 0.45em;
      padding-left: 1.25em;
      border-left: 1.5px solid rgba(99, 102, 241, 0.28);
      margin-left: 0.2rem;
    }
    .wiki-prose blockquote {
      position: relative;
      border-left: 4px solid #6366f1;
      padding: 0.9em 1.25em;
      margin: 1.4em 0;
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.06) 0%, rgba(99, 102, 241, 0.01) 100%);
      border-radius: 0 0.75rem 0.75rem 0;
    }
    .dark .wiki-prose blockquote {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.14) 0%, rgba(99, 102, 241, 0.02) 100%);
      border-left-color: #818cf8;
    }
    .wiki-prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      font-size: 0.9em;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .wiki-prose th, .wiki-prose td {
      border: 1px solid rgba(148, 163, 184, 0.28);
      padding: 0.7em 0.9em;
      text-align: left;
      vertical-align: top;
    }
    .wiki-prose th {
      background-color: rgba(148, 163, 184, 0.12);
      font-weight: 700;
    }

    @keyframes staggerRiseUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .stagger-item {
      opacity: 0;
      animation: staggerRiseUp 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .stagger-delay-1 { animation-delay: 0.03s; }
    .stagger-delay-2 { animation-delay: 0.09s; }
    .stagger-delay-3 { animation-delay: 0.16s; }
    .stagger-delay-4 { animation-delay: 0.23s; }

    .resizer-bar {
      height: 10px;
      cursor: row-resize;
      user-select: none;
    }
  </style>
</head>

<body class="bg-parchment-100 dark:bg-[#0B0F19] bg-archive-pattern text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200 overflow-hidden h-screen flex flex-col font-sans relative">

  <!-- Aurora Mesh Background -->
  <div class="fixed inset-x-0 top-0 h-72 aurora-glow-header pointer-events-none z-0"></div>

  <!-- Minimal Progress Bar -->
  <div class="fixed top-0 left-0 right-0 h-[2px] bg-stone-200/30 dark:bg-slate-800/40 z-50 pointer-events-none">
    <div id="readingProgressBar" class="h-full bg-gradient-to-r from-amber-500 via-indigo-500 to-fuchsia-500 w-0 transition-all duration-150"></div>
  </div>

  <!-- Top Header Bar -->

    <div class="flex items-center gap-2.5 min-w-0">
      <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-stone-100 dark:hover:bg-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div onclick="navigateToDoc('02_Wiki/index.md')" class="flex items-center gap-2.5 cursor-pointer group min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-700 flex items-center justify-center text-white font-bold shadow-sm shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-900 dark:text-white truncate">홍동우 목사의 설교 저장소</h1>
            <span id="totalDocsPill" class="hidden xl:inline-flex px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">Archive</span>
          </div>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block truncate">신학 및 설교 아카이브 (2016–2026)</p>
        </div>
      </div>
    </div>

    <div class="flex-1 max-w-md mx-1 sm:mx-3">
      <div class="relative">
        <input
          id="globalSearchInput"
          type="text"
          placeholder="설교 제목, 본문, 신학 개념, 인용구 검색... ( / 또는 ⌘K )"
          oninput="handleSearchInput(this.value)"
          onfocus="handleSearchInput(this.value)"
          class="w-full pl-9 pr-10 py-1.5 text-xs sm:text-sm rounded-xl bg-stone-100/90 dark:bg-slate-800/90 border border-stone-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
        />
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">✕</button>
        <div id="searchDropdown" class="hidden fixed sm:absolute left-2 right-2 sm:left-0 sm:right-0 top-14 sm:top-full mt-1.5 max-h-[75vh] overflow-y-auto rounded-2xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl shadow-2xl border border-stone-200 dark:border-slate-700 z-50 divide-y divide-stone-100 dark:divide-slate-800"></div>
      </div>
    </div>

    <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
      <button onclick="openRandomDiscovery()" title="오늘의 영감 조각" class="p-2 sm:px-2.5 sm:py-1.5 rounded-xl text-xs font-semibold bg-amber-500/10 hover:bg-amber-500/20 text-amber-800 dark:text-amber-300 border border-amber-500/20 flex items-center gap-1">
        <span>🎲</span><span class="hidden xl:inline">랜덤 탐색</span>
      </button>
      <button onclick="openGraphModal()" title="지식 그래프" class="p-2 sm:px-2.5 sm:py-1.5 rounded-xl text-xs font-semibold bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border border-indigo-500/20 flex items-center gap-1">
        <span>🕸️</span><span class="hidden xl:inline">지식 그래프</span>
      </button>
      <button onclick="toggleBookmarksPopover()" class="relative p-2 rounded-xl bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
        <span id="bookmarkCountDot" class="hidden absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center">0</span>
      </button>
      <button onclick="toggleFontFamily()" class="hidden md:flex px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-stone-200 dark:border-slate-700">
        <span id="fontFamilyLabel">명조</span>
      </button>
      <div class="flex items-center bg-stone-100 dark:bg-slate-800 rounded-xl p-0.5 border border-stone-200 dark:border-slate-700">
        <button onclick="adjustFontSize(-1)" class="px-2 py-1 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300">A-</button>
        <span id="fontSizeDisplay" class="px-1.5 text-[11px] font-mono text-slate-500 dark:text-slate-400 hidden sm:inline">18</span>
        <button onclick="adjustFontSize(1)" class="px-2 py-1 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300">A+</button>
      </div>
      <button onclick="toggleTheme()" class="p-2 rounded-xl bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-stone-200 dark:border-slate-700">
        <svg id="sunIcon" class="w-4 h-4 hidden text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg id="moonIcon" class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </header>

  <div id="bookmarksPopover" class="hidden fixed right-4 top-16 w-80 sm:w-96 max-h-[75vh] flex flex-col rounded-2xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl shadow-2xl border border-stone-200 dark:border-slate-700 z-50 overflow-hidden">
    <div class="px-4 py-3 border-b border-stone-200 dark:border-slate-800 flex items-center justify-between">

  <!-- Workspace Container -->
  <div class="flex-1 flex overflow-hidden relative">
    <div id="mobileBackdrop" onclick="closeMobileSidebar()" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-30 hidden lg:hidden"></div>

    <!-- Left Sidebar (RAW / WIKI Split) -->
    <aside id="leftSidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-80 sm:w-84 shrink-0 bg-[#f3efe6] dark:bg-[#0F1523] border-r border-stone-200/90 dark:border-slate-800 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out h-full select-none">
      <div class="p-2.5 border-b border-stone-200/80 dark:border-slate-800 bg-stone-200/40 dark:bg-slate-900/60 shrink-0 space-y-2">
        <div class="relative">
          <input
            id="sidebarFilterInput"
            type="text"
            placeholder="좌측 트리 메뉴 빠른 필터..."

  <!-- Main Logic Script -->
  <script>
    const FALLBACK_ARCHIVE_DATA = {
      meta: { total_docs: 410, counts: { raw_sermons: 126, raw_articles: 12, total_wiki: 272, wiki_concepts: 66 } },
      docs: {
        "02_Wiki/index.md": {
          id: "02_Wiki/index.md",
          path: "02_Wiki/index.md",
          basename: "index",
          title: "홍동우 목사의 설교 저장소 — 마스터 카탈로그",
          date: "2026-11-04",
          section: "wiki",
          category: "index",
          body: `# 홍동우 목사의 설교 저장소 (2016–2026)\n\n> [!tip] 🌐 디지털 신학 및 설교 아카이브\n> 좌측 메뉴와 상단 검색을 통해 10년 사역의 원본 설교와 신학 노트를 탐색하세요.`
        }
      }
    };

    const RESTRICTED_ARCHIVE_CONFIG = {
      restrictAllArticlesCategory: false,
      restrictedDocIds: ["251101 고통은 낭만적이지 않다","250901 바울의 시간 이해에 대한 새로운 관점","1강","2강","3강","4강","5강","6강","7강","8강"],
      restrictedMediaKeywords: ["복음과 상황", "복음과상황"],
      whitelistedDocIds: [],
      teaserCharLength: 360,
      noticeTitle: "유료 매체에 기고한 글이므로 자세한 열람을 제한합니다",
      noticeDescription: "정기간행물 저작권 보호 정책에 따라 아카이브 내 전문 공개가 제한되며, 도입부 미리보기와 WIKI 분석 노트를 제공합니다.",
      authorPasscode: "2026"
    };

    let ARCHIVE = null, DOCS_MAP = {}, LOOKUP_INDEX = {}, RAW_TO_WIKI_MAP = {}, WIKI_TO_RAW_MAP = {}, BACKLINKS_MAP = {}, OUTLINKS_MAP = {};
    let currentDocId = "02_Wiki/index.md";
    let isSplitViewActive = false;
    let currentFontSize = parseInt(localStorage.getItem("wiki_font_size") || "18", 10);
    let currentFontFamily = localStorage.getItem("wiki_font_family") || "serif";
    let bookmarksList = JSON.parse(localStorage.getItem("wiki_bookmarks") || "[]");
    let historyList = JSON.parse(localStorage.getItem("wiki_history") || "[]");
    let unlockedDocsSession = JSON.parse(sessionStorage.getItem("wiki_unlocked_docs") || "[]");
    let isGlobalAuthorUnlocked = sessionStorage.getItem("wiki_author_unlocked") === "true";
    let openFoldersState = { raw: { "Sermons": true, "articles": true }, wiki: { "synthesis": true, "series": true } };

    function isDocRestricted(doc) {
      if (!doc) return false;
      if (RESTRICTED_ARCHIVE_CONFIG.whitelistedDocIds.includes(doc.id) || RESTRICTED_ARCHIVE_CONFIG.whitelistedDocIds.includes(doc.basename)) return false;
      if (doc.restricted === true || doc.meta?.restricted === true) return true;
      if (RESTRICTED_ARCHIVE_CONFIG.restrictedDocIds.includes(doc.id) || RESTRICTED_ARCHIVE_CONFIG.restrictedDocIds.includes(doc.basename)) return true;
      if (doc.section === "raw") {
        if (RESTRICTED_ARCHIVE_CONFIG.restrictAllArticlesCategory && doc.category === "articles") return true;
        const text = `${doc.series || ""} ${doc.meta?.series || ""} ${(doc.tags || []).join(" ")}`;
        if (RESTRICTED_ARCHIVE_CONFIG.restrictedMediaKeywords.some(kw => text.includes(kw))) return true;
      }
      return false;
    }

    function isDocCurrentlyLocked(doc) {
      if (!isDocRestricted(doc)) return false;
      if (isGlobalAuthorUnlocked) return false;
      if (unlockedDocsSession.includes(doc.id)) return false;
      return true;
    }

    function unlockRestrictedDoc(docId, inputId, errorId) {
      const input = document.getElementById(inputId);
      const err = document.getElementById(errorId);
      if (!input) return;
      if (input.value.trim() === RESTRICTED_ARCHIVE_CONFIG.authorPasscode) {
        isGlobalAuthorUnlocked = true;
        sessionStorage.setItem("wiki_author_unlocked", "true");
        if (!unlockedDocsSession.includes(docId)) {
          unlockedDocsSession.push(docId);
          sessionStorage.setItem("wiki_unlocked_docs", JSON.stringify(unlockedDocsSession));
        }
        renderBothSidebars(document.getElementById("sidebarFilterInput")?.value || "");
        navigateToDoc(currentDocId, false);
      } else if (err) {
        err.classList.remove("hidden");
      }
    }

    function relockAuthorSession() {
      isGlobalAuthorUnlocked = false;
      unlockedDocsSession = [];
      sessionStorage.removeItem("wiki_author_unlocked");
      sessionStorage.removeItem("wiki_unlocked_docs");
      renderBothSidebars("");
      navigateToDoc(currentDocId, false);
    }

    function renderRestrictedPaywallHtml(doc) {
      const rawBody = (doc.body || "").replace(/^#\s+.+$/m, "").trim();
      const teaserLen = doc.teaserLength ?? RESTRICTED_ARCHIVE_CONFIG.teaserCharLength;
      const pairedWikiId = RAW_TO_WIKI_MAP[doc.id];
      const uid = Math.random().toString(36).slice(2, 8);

      let teaserHtml = "";
      if (teaserLen > 0 && rawBody.length > 0) {
        const sliced = rawBody.slice(0, teaserLen) + " …";
        teaserHtml = `<div class="relative overflow-hidden rounded-t-2xl"><div class="opacity-85 select-none pointer-events-none">${parseObsidianMarkdown(sliced)}</div><div class="h-32 -mt-24 relative z-10 bg-gradient-to-b from-transparent via-stone-100/90 to-stone-100 dark:via-[#0B0F19]/90 dark:to-[#0B0F19]"></div></div>`;
      }

      return `
        <div class="my-2 font-sans">
          ${teaserHtml}
          <div class="relative z-20 rounded-3xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-2 border-amber-500/40 p-6 sm:p-9 shadow-xl">
            <div class="flex items-center gap-4 mb-5">
              <div class="w-13 h-13 rounded-2xl bg-amber-500/20 border border-amber-500/35 flex items-center justify-center text-2xl shrink-0">🔒</div>
              <div>
                <span class="inline-flex px-3 py-0.5 rounded-full text-xs font-extrabold bg-amber-500/20 text-amber-900 dark:text-amber-300 mb-1.5">열람 제한 문서 (Restricted Article)</span>
                <h3 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white">“${escapeHtml(RESTRICTED_ARCHIVE_CONFIG.noticeTitle)}”</h3>
              </div>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed mb-6">${escapeHtml(RESTRICTED_ARCHIVE_CONFIG.noticeDescription)}</p>
            
            <div class="rounded-2xl bg-stone-100 dark:bg-slate-800 p-4 text-xs space-y-2 mb-6">
              <div><strong class="text-slate-500">매체:</strong> <span class="text-amber-800 dark:text-amber-300 font-bold">${escapeHtml(doc.series || '외부 유료 매체')}</span></div>
              <div><strong class="text-slate-500">발행일:</strong> <span class="font-mono">${escapeHtml(doc.date || "")} (${escapeHtml(doc.basename || "")})</span></div>
              ${doc.subject ? `<div><strong class="text-slate-500 block mb-1">요약:</strong> ${escapeHtml(doc.subject)}</div>` : ""}
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex gap-2">
                ${pairedWikiId ? `<button onclick="navigateToDoc('${escapeJsStr(pairedWikiId)}')" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm">🧠 WIKI 분석 노트 보기 →</button>` : ""}
                <button onclick="navigateToDoc('02_Wiki/index.md')" class="px-3.5 py-2.5 rounded-xl text-xs font-bold bg-stone-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200">🏛️ 카탈로그 홈</button>
              </div>
              <button onclick="document.getElementById('unlockBox_${uid}').classList.toggle('hidden')" class="text-xs font-bold text-slate-600 dark:text-slate-400 underline">🔑 저자 잠금 해제</button>
            </div>

            <div id="unlockBox_${uid}" class="hidden mt-4 pt-4 border-t border-stone-200 dark:border-slate-800 max-w-xs ml-auto">
              <div class="flex gap-1.5">
                <input id="unlockInput_${uid}" type="password" placeholder="비밀번호 (2026)" onkeydown="if(event.key==='Enter') unlockRestrictedDoc('${escapeJsStr(doc.id)}','unlockInput_${uid}','unlockErr_${uid}')" class="flex-1 px-3 py-1.5 rounded-xl text-xs bg-white dark:bg-slate-900 border border-stone-300 dark:border-slate-700 text-slate-900 dark:text-white" />
                <button onclick="unlockRestrictedDoc('${escapeJsStr(doc.id)}','unlockInput_${uid}','unlockErr_${uid}')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white">해제</button>
              </div>
              <p id="unlockErr_${uid}" class="hidden text-[11px] text-rose-500 mt-1">비밀번호가 틀렸습니다.</p>
            </div>
          </div>
        </div>
      `;
    }

    function initArchiveApp() {
      ARCHIVE = window.ARCHIVE_DATA || FALLBACK_ARCHIVE_DATA;
      DOCS_MAP = ARCHIVE.docs || {};
      buildArchiveIndices();

      const totalPill = document.getElementById("totalDocsPill");
      if (totalPill) totalPill.textContent = `${Object.keys(DOCS_MAP).length} Docs`;

      initThemeAndTypography();
      initSidebarResizer();
      updateBookmarkCountBadge();
      renderBothSidebars("");

      const hash = decodeURIComponent(window.location.hash.replace(/^#/, ""));
      if (hash && DOCS_MAP[hash]) navigateToDoc(hash, false);
      else navigateToDoc("02_Wiki/index.md", false);
    }

    function buildArchiveIndices() {
      LOOKUP_INDEX = {}; RAW_TO_WIKI_MAP = {}; WIKI_TO_RAW_MAP = {}; BACKLINKS_MAP = {}; OUTLINKS_MAP = {};
      Object.keys(DOCS_MAP).forEach(id => {
        const doc = DOCS_MAP[id];
        doc.id = id;
        const base = doc.basename || id.split("/").pop().replace(/\.md$/i, "");
        doc.basename = base;
        LOOKUP_INDEX[id] = id;
        LOOKUP_INDEX[base] = id;
        LOOKUP_INDEX[base.toLowerCase().replace(/[\s_-]/g, "")] = id;
        if (doc.title) LOOKUP_INDEX[doc.title.toLowerCase().replace(/[\s_-]/g, "")] = id;
        
        const m = base.match(/^(\d{6})/);
        if (m) {
          LOOKUP_INDEX[`raw_${m[1]}`] = id;
          LOOKUP_INDEX[`wiki_${m[1]}`] = id;
          LOOKUP_INDEX[m[1]] = id;
        }
        BACKLINKS_MAP[id] = new Set();
        OUTLINKS_MAP[id] = new Set();
      });

      Object.keys(DOCS_MAP).forEach(id => {
        const doc = DOCS_MAP[id];
        if (doc.section === "wiki" && doc.category === "sources") {
          const rawPath = doc.meta?.raw_path;
          if (rawPath && DOCS_MAP[rawPath]) {
            RAW_TO_WIKI_MAP[rawPath] = id;
            WIKI_TO_RAW_MAP[id] = rawPath;
          } else {
            const m = doc.basename.match(/^(\d{6})/);
            if (m && LOOKUP_INDEX[`raw_${m[1]}`]) {
              RAW_TO_WIKI_MAP[LOOKUP_INDEX[`raw_${m[1]}`]] = id;
              WIKI_TO_RAW_MAP[id] = LOOKUP_INDEX[`raw_${m[1]}`];
            }
          }
        }
      });

      const wikiLinkRegex = /\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|([^\]]+))?\]\]/g;
      Object.keys(DOCS_MAP).forEach(id => {
        const doc = DOCS_MAP[id];
        const text = `${doc.body || ""} ${(doc.theologians || []).join(" ")} ${(doc.concepts || []).join(" ")}`;
        let m;
        while ((m = wikiLinkRegex.exec(text)) !== null) {
          const tId = resolveWikiLink(m[1]);
          if (tId && tId !== id) {
            OUTLINKS_MAP[id].add(tId);
            BACKLINKS_MAP[tId].add(id);
          }
        }
      });
    }

    function resolveWikiLink(rawTarget) {
      if (!rawTarget) return null;
      const c = rawTarget.trim().replace(/\.md$/i, "");
      if (LOOKUP_INDEX[c]) return LOOKUP_INDEX[c];
      const norm = c.toLowerCase().replace(/[\s_-]/g, "");
      if (LOOKUP_INDEX[norm]) return LOOKUP_INDEX[norm];
      const seg = c.split("/").pop();
      if (LOOKUP_INDEX[seg]) return LOOKUP_INDEX[seg];
      const m = seg.match(/^(\d{6})/);
      if (m) return LOOKUP_INDEX[`wiki_${m[1]}`] || LOOKUP_INDEX[`raw_${m[1]}`] || null;
      return null;
    }

    function renderBothSidebars(q = "") {
      const raw = [], wiki = [];
      Object.values(DOCS_MAP).forEach(d => {
        if (q && !`${d.title} ${d.basename} ${d.date}`.toLowerCase().includes(q)) return;
        if (d.section === "raw") raw.push(d);
        else wiki.push(d);
      });
      document.getElementById("rawCountBadge").textContent = raw.length;
      document.getElementById("wikiCountBadge").textContent = wiki.length;
      renderRawSidebarTree(raw, q.length > 0);
      renderWikiSidebarTree(wiki, q.length > 0);
    }

    function renderRawSidebarTree(docs, expand) {
      const el = document.getElementById("rawMenuContainer");
      if (!el) return;
      const tree = {};
      docs.forEach(d => {
        const p = d.path.replace(/^01_Raw\//, "").split("/");
        const top = p[0] || "기타";
        const sub = p.length > 2 ? p[1] : "_root";
        if (!tree[top]) tree[top] = {};
        if (!tree[top][sub]) tree[top][sub] = [];
        tree[top][sub].push(d);
      });

      let html = "";
      Object.keys(tree).sort().forEach(top => {
        const isOpen = expand || openFoldersState.raw[top] !== false;
        const count = Object.values(tree[top]).reduce((a, b) => a + b.length, 0);
        html += `<div class="mb-1"><button onclick="toggleFolder('raw','${top}')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-xl font-bold text-slate-700 dark:text-slate-200 hover:bg-amber-500/10"><span>📁 ${top}</span><span class="text-[10px] font-mono">${count}</span></button><div class="${isOpen?'block':'hidden'} pl-3 mt-1 space-y-1 tree-guide-line">`;
        Object.keys(tree[top]).sort().forEach(sub => {
          const items = tree[top][sub].sort((a, b) => (a.date || a.basename).localeCompare(b.date || b.basename));
          if (sub === "_root") {
            items.forEach(d => html += renderSidebarItem(d, "amber"));
          } else {
            html += `<div class="font-semibold text-[11px] text-slate-500 pt-1">📂 ${sub}</div>${items.map(d => renderSidebarItem(d, "amber")).join("")}`;
          }
        });
        html += `</div></div>`;
      });
      el.innerHTML = html;
    }

    function renderWikiSidebarTree(docs, expand) {
      const el = document.getElementById("wikiMenuContainer");
      if (!el) return;
      const cats = [
        { key: "index", label: "🏛️ 마스터 카탈로그" },
        { key: "synthesis", label: "🧭 시대별·사상 종합" },
        { key: "series", label: "📚 강해 시리즈" },
        { key: "concepts", label: "💡 신학 개념" },
        { key: "theologians", label: "🎓 신학자" },
        { key: "sources", label: "📝 설교 분석 노트" }
      ];
      const grouped = {};
      docs.forEach(d => {
        const c = d.category || "sources";
        if (!grouped[c]) grouped[c] = [];
        grouped[c].push(d);
      });

      let html = "";
      cats.forEach(({ key, label }) => {
        const items = grouped[key] || [];
        if (!items.length) return;
        if (key === "index") {
          items.forEach(d => html += renderSidebarItem(d, "indigo"));
          return;
        }
        const isOpen = expand || openFoldersState.wiki[key] === true;
        html += `<div class="mb-1"><button onclick="toggleFolder('wiki','${key}')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-xl font-bold text-slate-700 dark:text-slate-200 hover:bg-indigo-500/10"><span>${label}</span><span class="text-[10px] font-mono">${items.length}</span></button><div class="${isOpen?'block':'hidden'} pl-3 mt-1 space-y-0.5 tree-guide-line">${items.map(d => renderSidebarItem(d, "indigo")).join("")}</div></div>`;
      });
      el.innerHTML = html;
    }

    function renderSidebarItem(d, color) {
      const active = d.id === currentDocId;
      const restricted = isDocRestricted(d);
      const locked = isDocCurrentlyLocked(d);
      const activeCls = color === "amber" ? "bg-amber-500/15 text-amber-950 dark:text-amber-200 font-bold border-l-2 border-amber-500" : "bg-indigo-500/15 text-indigo-950 dark:text-indigo-200 font-bold border-l-2 border-indigo-500";
      return `<button onclick="navigateToDoc('${escapeJsStr(d.id)}')" class="w-full text-left px-2.5 py-1.5 rounded-r-xl flex items-center justify-between gap-1 transition-colors ${active ? activeCls : 'text-slate-600 dark:text-slate-400 hover:bg-stone-200 dark:hover:bg-slate-800'}"><span class="truncate text-[11px]">${escapeHtml(d.title || d.basename)}</span>${restricted ? `<span class="shrink-0 text-[9px] px-1.5 py-0.5 rounded-full font-bold ${locked ? 'bg-rose-500/15 text-rose-600' : 'bg-emerald-500/15 text-emerald-600'}">${locked ? '🔒' : '🔓'}</span>` : ''}</button>`;
    }

    function toggleFolder(sec, key) {
      openFoldersState[sec][key] = !openFoldersState[sec][key];
      renderBothSidebars(document.getElementById("sidebarFilterInput")?.value || "");
    }

    function toggleAllFolders(sec, exp) {
      if (sec === "raw") Object.keys(openFoldersState.raw).forEach(k => openFoldersState.raw[k] = exp);
      else Object.keys(openFoldersState.wiki).forEach(k => openFoldersState.wiki[k] = exp);
      renderBothSidebars("");
    }

    function filterSidebarTree(val) { renderBothSidebars(val); }

    function navigateToDoc(docId, closeMobile = true) {
      const doc = DOCS_MAP[docId];
      if (!doc) return;
      currentDocId = docId;
      window.location.hash = encodeURIComponent(docId);
      if (closeMobile) closeMobileSidebar();
      
      historyList = [docId, ...historyList.filter(id => id !== docId)].slice(0, 15);
      localStorage.setItem("wiki_history", JSON.stringify(historyList));
      updateBookmarkBtn();
      renderBothSidebars(document.getElementById("sidebarFilterInput")?.value || "");

      const hero = document.getElementById("archiveHeroDashboard");
      if (docId === "02_Wiki/index.md") {
        hero.classList.remove("hidden");
        renderBentoHero();
      } else {
        hero.classList.add("hidden");
      }

      renderBreadcrumbAndSwitch(doc);
      renderMetaHeader(doc);
      renderContentArea(doc);
      renderBacklinks(doc);
      renderTOC(doc);
      drawMiniGraph();

      document.getElementById("mainScrollArea").scrollTop = 0;
    }

    function renderBentoHero() {
      const el = document.getElementById("archiveHeroDashboard");
      if (!el) return;
      el.innerHTML = `
        <div class="glass-panel bento-card rounded-3xl p-6 sm:p-7 relative overflow-hidden mb-6">
          <span class="capsule-pill bg-indigo-500/15 text-indigo-700 dark:text-indigo-300 mb-3">✨ 2016–2026 아카이브 대시보드</span>
          <h2 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mb-2">“내가 성경을 읽는 것이 아니라, 성경이 내 인생을 읽어준다”</h2>
          <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-4">10년간 선포된 138편의 원본 설교와 272편의 위키 신학 지식베이스를 입체적으로 탐색하세요.</p>
          <button onclick="navigateToDoc('02_Wiki/synthesis/00_2016-2026_10년_사역계승_및_신학궤적_마스터보고서.md')" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm">🧭 10년 신학 마스터 보고서 읽기 →</button>
        </div>
      `;
    }

    function renderBreadcrumbAndSwitch(doc) {
      document.getElementById("docBreadcrumb").innerHTML = doc.path.split("/").map((p, i, arr) => `<span class="${i===arr.length-1?'text-slate-800 dark:text-slate-200 font-bold':''}">${escapeHtml(p)}</span>`).join("<span class='text-slate-300'>/</span>");
      const pairedId = doc.section === "raw" ? RAW_TO_WIKI_MAP[doc.id] : WIKI_TO_RAW_MAP[doc.id];
      let html = "";
      if (isDocRestricted(doc) && !isDocCurrentlyLocked(doc)) html += `<button onclick="relockAuthorSession()" class="capsule-pill bg-emerald-500/15 text-emerald-700">🔓 저자 열람중 (잠그기)</button>`;
      if (pairedId && DOCS_MAP[pairedId]) {
        html += `<button onclick="navigateToDoc('${escapeJsStr(pairedId)}')" class="capsule-pill bg-indigo-500/15 text-indigo-700 dark:text-indigo-300">${doc.section === "raw" ? "🧠 WIKI 분석" : "📜 원본 설교"} 이동</button>`;
        html += `<button onclick="toggleSplitView()" class="capsule-pill ${isSplitViewActive?'bg-amber-500 text-white':'bg-stone-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200'}">⚖️ 나란히 비교</button>`;
      }
      document.getElementById("crossSwitchContainer").innerHTML = html;
    }

    function renderMetaHeader(doc) {
      const locked = isDocCurrentlyLocked(doc);
      document.getElementById("docMetaCard").innerHTML = `
        <div class="glass-panel rounded-3xl p-5 sm:p-7">
          <div class="flex flex-wrap items-center gap-2 mb-3">
            <span class="capsule-pill bg-amber-500/15 text-amber-800 dark:text-amber-300">${doc.section.toUpperCase()}</span>
            ${isDocRestricted(doc) ? `<span class="capsule-pill ${locked?'bg-rose-500/15 text-rose-600':'bg-emerald-500/15 text-emerald-600'}">${locked?'🔒 열람 제한':'🔓 제한 해제'}</span>` : ''}
            ${doc.date ? `<span class="capsule-pill bg-stone-200 dark:bg-slate-800 font-mono">${doc.date}</span>` : ''}
          </div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white">${escapeHtml(doc.title || doc.basename)}</h1>
          ${doc.subject ? `<p class="mt-2 text-xs sm:text-sm text-slate-600 dark:text-slate-300">${escapeHtml(doc.subject)}</p>` : ''}
        </div>
      `;
    }

    function renderContentArea(doc) {
      const grid = document.getElementById("docContentGrid");
      const mainBody = document.getElementById("docBodyContainer");
      const splitBody = document.getElementById("splitCompanionContainer");

      if (isDocCurrentlyLocked(doc)) {
        mainBody.innerHTML = renderRestrictedPaywallHtml(doc);
      } else {
        mainBody.innerHTML = parseObsidianMarkdown(doc.body || "");
      }

      const pairedId = doc.section === "raw" ? RAW_TO_WIKI_MAP[doc.id] : WIKI_TO_RAW_MAP[doc.id];
      if (isSplitViewActive && pairedId && DOCS_MAP[pairedId]) {
        const comp = DOCS_MAP[pairedId];
        grid.classList.remove("grid-cols-1"); grid.classList.add("lg:grid-cols-2");
        splitBody.classList.remove("hidden");
        splitBody.innerHTML = `<div class="mb-4 pb-2 border-b border-stone-200 dark:border-slate-800 font-bold text-xs text-indigo-600">⚖️ 대조: ${escapeHtml(comp.title)}</div>` + (isDocCurrentlyLocked(comp) ? renderRestrictedPaywallHtml(comp) : parseObsidianMarkdown(comp.body || ""));
      } else {
        grid.classList.remove("lg:grid-cols-2"); grid.classList.add("grid-cols-1");
        splitBody.classList.add("hidden"); splitBody.innerHTML = "";
      }
    }

    function toggleSplitView() {
      isSplitViewActive = !isSplitViewActive;
      renderContentArea(DOCS_MAP[currentDocId]);
    }

    function parseObsidianMarkdown(md) {
      if (!md) return "";
      return md.split("\n\n").map(p => {
        p = escapeHtml(p.trim());
        p = p.replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|([^\]]+))?\]\]/g, (_, t, a) => {
          const r = resolveWikiLink(t);
          const lbl = a || t.split("/").pop();
          return r ? `<a href="#" onclick="event.preventDefault(); navigateToDoc('${escapeJsStr(r)}')" class="text-indigo-600 dark:text-indigo-400 font-bold underline">${lbl}</a>` : lbl;
        });
        return `<p>${p}</p>`;
      }).join("");
    }

    function renderBacklinks(doc) {
      const container = document.getElementById("docBacklinksContainer");
      const links = Array.from(new Set([...(BACKLINKS_MAP[doc.id] || []), ...(OUTLINKS_MAP[doc.id] || [])])).filter(id => DOCS_MAP[id]);
      if (!links.length) { container.innerHTML = ""; return; }
      container.innerHTML = `<h3 class="text-xs font-bold text-slate-400 mb-3">🔗 연결된 문서 (${links.length})</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${links.slice(0,8).map(id => `<div onclick="navigateToDoc('${escapeJsStr(id)}')" class="glass-panel p-3 rounded-xl cursor-pointer text-xs font-bold hover:text-indigo-600 truncate">${escapeHtml(DOCS_MAP[id].title)}</div>`).join("")}</div>`;
    }

    function renderTOC(doc) {
      const toc = document.getElementById("tocListContainer");
      if (!toc) return;
      if (isDocCurrentlyLocked(doc)) { toc.innerHTML = `<span class="text-rose-500 text-[11px]">목차 제한됨</span>`; return; }
      const headings = document.querySelectorAll("#docBodyContainer h2, #docBodyContainer h3");
      toc.innerHTML = Array.from(headings).map(h => `<a href="#" onclick="event.preventDefault(); document.getElementById('${h.id}')?.scrollIntoView({behavior:'smooth'})" class="block py-1 truncate hover:text-indigo-600">${escapeHtml(h.textContent)}</a>`).join("") || `<span class="text-slate-400 text-[11px]">목차 없음</span>`;
    }

    function handleSearchInput(q) {
      const dd = document.getElementById("searchDropdown");
      const cl = document.getElementById("clearSearchBtn");
      q = (q || "").trim().toLowerCase();
      if (!q) { dd.classList.add("hidden"); cl.classList.add("hidden"); return; }
      cl.classList.remove("hidden");
      const res = [];
      Object.values(DOCS_MAP).forEach(d => {
        if ((d.title || "").toLowerCase().includes(q) || (d.body || "").toLowerCase().includes(q)) {
          res.push(d); if (res.length >= 15) return;
        }
      });
      dd.innerHTML = res.length ? res.map(d => `<div onclick="navigateToDoc('${escapeJsStr(d.id)}'); clearSearch();" class="p-3 hover:bg-indigo-500/10 cursor-pointer text-xs"><div class="font-bold">${escapeHtml(d.title)}</div></div>`).join("") : `<div class="p-3 text-xs text-slate-400 text-center">결과 없음</div>`;
      dd.classList.remove("hidden");
    }

    function clearSearch() { document.getElementById("globalSearchInput").value = ""; document.getElementById("searchDropdown").classList.add("hidden"); document.getElementById("clearSearchBtn").classList.add("hidden"); }

    function toggleCurrentDocBookmark() {
      if (bookmarksList.includes(currentDocId)) bookmarksList = bookmarksList.filter(id => id !== currentDocId);
      else bookmarksList.unshift(currentDocId);
      localStorage.setItem("wiki_bookmarks", JSON.stringify(bookmarksList));
      updateBookmarkBtn();
      updateBookmarkCountBadge();
    }

    function updateBookmarkBtn() {
      const b = bookmarksList.includes(currentDocId);
      document.getElementById("bookmarkDocIcon").textContent = b ? "★" : "☆";
      document.getElementById("bookmarkDocText").textContent = b ? "북마크됨" : "북마크";
    }

    function updateBookmarkCountBadge() {
      const dot = document.getElementById("bookmarkCountDot");
      if (bookmarksList.length > 0) { dot.textContent = bookmarksList.length; dot.classList.remove("hidden"); } else { dot.classList.add("hidden"); }
    }

    function toggleBookmarksPopover() {
      const pop = document.getElementById("bookmarksPopover");
      pop.classList.toggle("hidden");
      if (!pop.classList.contains("hidden")) {
        document.getElementById("bookmarksPopoverBody").innerHTML = bookmarksList.map(id => DOCS_MAP[id] ? `<button onclick="navigateToDoc('${escapeJsStr(id)}'); toggleBookmarksPopover();" class="w-full text-left p-2 rounded hover:bg-stone-100 dark:hover:bg-slate-800 truncate">★ ${escapeHtml(DOCS_MAP[id].title)}</button>` : "").join("") || `<p class="text-slate-400">북마크 없음</p>`;
      }
    }

    function openRandomDiscovery() {
      const keys = Object.keys(DOCS_MAP);
      const rand = keys[Math.floor(Math.random() * keys.length)];
      const doc = DOCS_MAP[rand];
      const locked = isDocCurrentlyLocked(doc);
      document.getElementById("randomModalContent").innerHTML = `<h4 class="font-bold">${escapeHtml(doc.title)}</h4><p class="text-xs text-slate-500">${locked ? '유료 매체 기고문' : escapeHtml(doc.subject || '무작위 추천 문서')}</p>`;
      document.getElementById("randomGoBtn").onclick = () => { closeRandomModal(); navigateToDoc(rand); };
      document.getElementById("randomModal").classList.remove("hidden");
    }

    function closeRandomModal() { document.getElementById("randomModal").classList.add("hidden"); }

    function drawMiniGraph() {
      const cvs = document.getElementById("miniGraphCanvas");
      if (!cvs) return;
      const ctx = cvs.getContext("2d");
      cvs.width = cvs.clientWidth || 220; cvs.height = cvs.clientHeight || 130;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.beginPath(); ctx.arc(cvs.width/2, cvs.height/2, 6, 0, Math.PI*2); ctx.fillStyle = "#6366f1"; ctx.fill();
    }

    function openGraphModal() { document.getElementById("graphModal").classList.remove("hidden"); }
    function closeGraphModal() { document.getElementById("graphModal").classList.add("hidden"); }

    function initThemeAndTypography() {
      const dark = localStorage.getItem("wiki_theme") === "dark";
      document.documentElement.classList.toggle("dark", dark);
      applyTypography();
    }

    function toggleTheme() {
      const dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("wiki_theme", dark ? "dark" : "light");
    }

    function adjustFontSize(d) {
      currentFontSize = Math.min(24, Math.max(14, currentFontSize + d));
      localStorage.setItem("wiki_font_size", currentFontSize);
      applyTypography();
    }

    function toggleFontFamily() {
      currentFontFamily = currentFontFamily === "serif" ? "sans" : "serif";
      localStorage.setItem("wiki_font_family", currentFontFamily);
      applyTypography();
    }

    function applyTypography() {
      document.documentElement.style.setProperty("--doc-font-size", `${currentFontSize}px`);
      document.getElementById("fontSizeDisplay").textContent = currentFontSize;
      document.getElementById("fontFamilyLabel").textContent = currentFontFamily === "serif" ? "명조" : "고딕";
      const b = document.getElementById("docBodyContainer");
      if (b) { b.classList.toggle("font-serif", currentFontFamily === "serif"); b.classList.toggle("font-sans", currentFontFamily === "sans"); }
    }

    function handleMainScroll() {
      const el = document.getElementById("mainScrollArea");
      const bar = document.getElementById("readingProgressBar");
      const max = el.scrollHeight - el.clientHeight;
      bar.style.width = `${max > 0 ? (el.scrollTop / max) * 100 : 0}%`;
    }

    function setSidebarSplit(pct) { document.getElementById("rawSidebarPane").style.height = `${pct}%`; }
    function initSidebarResizer() {
      const res = document.getElementById("sidebarResizer"), sb = document.getElementById("leftSidebar"), raw = document.getElementById("rawSidebarPane");
      let drag = false;
      res.addEventListener("mousedown", () => drag = true);
      window.addEventListener("mouseup", () => drag = false);
      window.addEventListener("mousemove", e => {
        if (!drag) return;
        const rect = sb.getBoundingClientRect();
        const pct = Math.min(80, Math.max(20, ((e.clientY - rect.top - 70) / (rect.height - 80)) * 100));
        raw.style.height = `${pct}%`;
      });
    }

    function toggleMobileSidebar() { document.getElementById("leftSidebar").classList.toggle("-translate-x-full"); document.getElementById("mobileBackdrop").classList.toggle("hidden"); }
    function closeMobileSidebar() { document.getElementById("leftSidebar").classList.add("-translate-x-full"); document.getElementById("mobileBackdrop").classList.add("hidden"); }

    function escapeHtml(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function escapeJsStr(s) { return String(s || "").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

    window.addEventListener("DOMContentLoaded", initArchiveApp);
  </script>
</body>
</html>
